<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>RCFG Editor — Raycasting Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#12100e; --panel:#1a1714; --panel2:#211d19; --line:#332c26;
    --text:#e8e0d4; --dim:#9a8f80; --amber:#e0a458; --amber-dim:#8a6a3a;
    --cyan:#5fd8d0; --danger:#c9564f; --mono:'JetBrains Mono','Consolas',monospace;
    --serif:'Georgia','Times New Roman',serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:var(--mono);font-size:13px;}
  body{display:flex;flex-direction:column;}

  header{display:flex;align-items:center;gap:14px;padding:10px 16px;
    background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;}
  header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;
    color:var(--amber);letter-spacing:.3px;}
  header .sub{color:var(--dim);font-size:11px;margin-top:1px;}
  header .grow{flex:1;}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:6px 12px;border-radius:3px;font-family:var(--mono);font-size:12px;
    cursor:pointer;transition:border-color .15s;}
  .btn:hover{border-color:var(--amber-dim);}
  .btn.primary{background:var(--amber);color:#1a1410;border-color:var(--amber);font-weight:600;}
  .btn.primary:hover{background:#eab674;}
  .btn.danger{border-color:var(--danger);color:var(--danger);}
  input[type=file]{display:none;}

  main{flex:1;display:flex;min-height:0;}

  /* ---- left: palette ---- */
  #palette{width:168px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
    padding:12px;overflow-y:auto;}
  #palette h2{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);
    margin:14px 0 6px;}
  #palette h2:first-child{margin-top:0;}
  .tool{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:3px;
    cursor:pointer;border:1px solid transparent;margin-bottom:2px;}
  .tool:hover{background:var(--panel2);}
  .tool.active{border-color:var(--amber);background:#2a2118;}
  .swatch{width:16px;height:16px;border-radius:3px;border:1px solid #0006;flex-shrink:0;}
  .tool .lab{font-size:12px;}
  .tool .lab .k{color:var(--dim);font-size:10px;}

  /* ---- center: canvas ---- */
  #stage{flex:1;display:flex;flex-direction:column;min-width:0;}
  #stagebar{display:flex;align-items:center;gap:10px;padding:8px 14px;
    background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;flex-wrap:wrap;}
  #stagebar label{color:var(--dim);font-size:11px;}
  #stagebar input[type=number]{width:52px;background:var(--bg);border:1px solid var(--line);
    color:var(--text);padding:4px 6px;border-radius:3px;font-family:var(--mono);}
  #canvaswrap{flex:1;overflow:auto;position:relative;background:
    radial-gradient(circle at 50% 0%, #1c1815, var(--bg));}
  #mapspacer{position:absolute;top:0;left:0;pointer-events:none;width:1px;height:1px;}
  #mapcanvas{background:#0c0a08;image-rendering:pixelated;
    cursor:crosshair;position:sticky;top:0;left:0;display:block;}
  #stagebar .stat{color:var(--dim);font-size:11px;}
  #stagebar .stat b{color:var(--cyan);font-weight:600;}
  #hoverCoord{color:var(--dim);font-size:11px;min-width:64px;}

  /* ---- right: inspector ---- */
  #inspector{width:340px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;}
  #tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);flex-shrink:0;}
  #tabs button{flex:1 1 auto;background:none;border:none;color:var(--dim);padding:8px 4px;
    font-family:var(--mono);font-size:10.5px;cursor:pointer;border-bottom:2px solid transparent;
    letter-spacing:.3px;}
  #tabs button:hover{color:var(--text);}
  #tabs button.active{color:var(--amber);border-bottom-color:var(--amber);}
  #panels{flex:1;overflow-y:auto;padding:14px;}
  .panel{display:none;}
  .panel.active{display:block;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:11px;color:var(--dim);margin-bottom:3px;}
  .field input[type=text],.field input[type=number],.field textarea{
    width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
    padding:6px 8px;border-radius:3px;font-family:var(--mono);font-size:12px;}
  .field textarea{resize:vertical;min-height:50px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  fieldset{border:1px solid var(--line);border-radius:4px;margin:0 0 14px;padding:10px;}
  fieldset legend{color:var(--amber);font-size:11px;padding:0 6px;text-transform:uppercase;
    letter-spacing:.5px;}
  .entry{border:1px solid var(--line);border-radius:4px;padding:8px;margin-bottom:8px;
    background:var(--panel2);}
  .entry-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .entry-head span{color:var(--cyan);font-size:11px;font-weight:600;}
  .rm{background:none;border:none;color:var(--dim);cursor:pointer;font-size:14px;
    line-height:1;padding:0 4px;}
  .rm:hover{color:var(--danger);}
  .addbtn{width:100%;background:var(--panel2);border:1px dashed var(--line);color:var(--dim);
    padding:8px;border-radius:4px;cursor:pointer;font-family:var(--mono);font-size:11px;}
  .addbtn:hover{border-color:var(--amber-dim);color:var(--amber);}
  .hint{color:var(--dim);font-size:10.5px;line-height:1.5;margin-top:8px;}
  #status{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
    background:#1a1714;border:1px solid var(--amber-dim);color:var(--amber);
    padding:8px 16px;border-radius:4px;font-size:12px;opacity:0;pointer-events:none;
    transition:opacity .2s;z-index:99;}
  #status.show{opacity:1;}
</style>
</head>
<body>

<header>
  <div>
    <h1>RCFG Editor</h1>
    <div class="sub">editor visual standalone · Raycasting Engine</div>
  </div>
  <div class="grow"></div>
  <button class="btn" id="btnNew">Novo mapa</button>
  <button class="btn" id="btnLoad">Abrir .rcfg</button>
  <input type="file" id="fileInput" accept=".rcfg,.txt">
  <button class="btn primary" id="btnExport">Baixar .rcfg</button>
</header>

<main>
  <div id="palette"></div>

  <div id="stage">
    <div id="stagebar">
      <label>Linhas</label><input type="number" id="rowsInput" min="1" max="4000">
      <label>Colunas</label><input type="number" id="colsInput" min="1" max="4000">
      <button class="btn" id="btnResize">Redimensionar</button>
      <label style="margin-left:10px">Zoom</label>
      <input type="number" id="zoomInput" min="4" max="48" value="26" style="width:44px">
      <button class="btn" id="btnFit" title="Ajustar zoom pra caber na tela">Ajustar</button>
      <div class="grow"></div>
      <span id="hoverCoord">—</span>
      <span class="stat">Paredes: <b id="statWalls">0</b></span>
      <span class="stat">Luzes: <b id="statLights">0</b></span>
      <span class="stat">Billboards: <b id="statBB">0</b></span>
      <span class="stat">Partículas: <b id="statP">0</b></span>
    </div>
    <div id="canvaswrap"><div id="mapspacer"></div><canvas id="mapcanvas"></canvas></div>
  </div>

  <div id="inspector">
    <div id="tabs"></div>
    <div id="panels"></div>
  </div>
</main>

<div id="status"></div>

<script>
/* ══════════════════════════════════════════════════════════════════
   RCFG EDITOR — espelha o parser/serializer de Raycasting.pyw em JS.
   Formato sempre exportado em "novo" (L1-L9 luz, B1-B9 billboard),
   mas o carregamento aceita tanto legado (dígitos 7-9 = luz) quanto
   novo, igual à engine Python.
   ══════════════════════════════════════════════════════════════════ */

const DEFAULT_CONFIG = {
  window_w:960, window_h:560, mm:140, fov:60, num_rays:200, max_depth:30,
  move_speed:0.06, run_multiplier:1.8, mouse_sens_x:0.004, mouse_sens_y:1.0,
  max_look_y:240, fog:1.4, gradient_steps:14, ambient:0.07, floor_bands:3,
  floor_step:2, light_res:1, light_soft_samples:6, light_soft_radius:0.4,
  light_bounce:0.35, light_bounce_radius:1.6, light_bounce_passes:2, texture_size:256,
  wall_scale:1
};
const LIGHT_RES_VALIDOS = [1,2,4,8,16,32];
const THEME_KEYS = ["sky_base","sky_top","floor_base","floor_top","crosshair",
  "hud_light","hud_alert","minimap_player"];
const DEFAULT_WALL_COLORS = ["#7a6a55","#5590c8","#4caf6b","#c85a8a","#9a6ac8","#c8935a",
  "#c8b45a","#5ac8b0","#c85a5a"];
// Defaults espelham _parse_sky() da engine: sem a seção, enabled=false (sem
// sol/lua/estrelas). Quando a seção existe, STARS padrão é 140 (comportamento
// exato do back-end, que usa d.get("stars", 140)).
const DEFAULT_SKY = {enabled:false, cycle:false, day_length:120, start_time:8,
  sun_peak:45, sun_color:"#fff2c0", moon_color:"#b9c6e0", stars:140};
// Defaults de uma entrada nova de [PARTICLES] (mesmos valores de _parse_particles).
const DEFAULT_PARTICLE = ["", 8, 0.5, 0.4];

function blankMap(rows, cols){
  const g = [];
  for(let j=0;j<rows;j++){
    const row=[];
    for(let i=0;i<cols;i++){
      const border = (i===0||j===0||i===cols-1||j===rows-1);
      row.push(border ? "1" : "0");
    }
    g.push(row);
  }
  return g;
}

function freshState(){
  return {
    config: {...DEFAULT_CONFIG},
    spawn: {x:1.5, y:1.5, angle:0},
    info: [["NAME","Novo Mapa"], ["AUTHOR",""]],
    colors: {1:["#7a6a55","#5a4d3d"]},
    textures: {},
    lights: {1:["#fff8e7", 4.0]},
    theme: {sky_base:"#1a1a3a", sky_top:"#4a3b6e", floor_base:"#1e1e24",
            floor_top:"#3a3a4d", crosshair:"#00ffff", hud_light:"#00ffcc",
            hud_alert:"#ffcc00", minimap_player:"#00ffff"},
    title: "🔮 Novo Mapa",
    billboards: {},
    sky: {...DEFAULT_SKY},
    particles: {},
    map: blankMap(10,12),
  };
}

let state = freshState();
let tool = {kind:"wall", n:1}; // kind: empty | wall | light | billboard
let painting = false;
let paintErase = false;
let lastMousePos = {i: 0, j: 0}; // Armazena a última posição do mouse

/* ───────────────────────── PARSER (mirror _parse_sections) ───────────────────────── */

function stripComment(line){
  if(line.replace(/^\s+/,"").startsWith("#")) return "";
  const m = line.match(/(?:\s#(?=\s)|#\s*$)/);
  if(m) return line.slice(0, m.index);
  return line;
}

function parseSections(text){
  const lines = text.split(/\r?\n/);
  let section = null;
  const dados = {};
  for(let raw of lines){
    let linha = stripComment(raw).replace(/\s+$/,"");
    if(!linha.trim()) continue;
    const stripped = linha.trim();
    if(stripped.startsWith("[") && stripped.endsWith("]")){
      section = stripped.slice(1,-1).trim().toUpperCase();
      dados[section] = (section==="MAP") ? [] : {};
      continue;
    }
    if(section===null) continue;
    if(section==="MAP"){
      const celulas = stripped.split(/[\s,;]+/).filter(Boolean);
      dados.MAP.push(celulas);
    } else if(section==="TITLE"){
      dados.TITLE.value = stripped;
    } else {
      const m = stripped.match(/^(\S+)[\s,]+(.*)$/);
      let chave, valor;
      if(m){ chave = m[1].toLowerCase(); valor = m[2].trim(); }
      else { chave = stripped.toLowerCase(); valor = ""; }
      dados[section][chave] = valor;
    }
  }
  return dados;
}

function processMapTokens(rawRows){
  let isNew = false;
  for(const row of rawRows) for(const tok of row){
    const up = tok.toUpperCase();
    if(up.length>=2 && (up[0]==="L"||up[0]==="B"||up[0]==="P") && /^\d+$/.test(up.slice(1))){ isNew = true; break; }
    if(up==="N" || up.includes("+")){ isNew = true; break; }
  }
  const grid = [];
  const legacyLightRemap = {}; // legacy digit -> new n (1..)
  for(const row of rawRows){
    const outRow = [];
    for(const tok of row){
      const up = tok.toUpperCase();
      if(up.includes("+")){
        // token composto (PLANO.md item 4): "base+L#+B#+P#" — preserva
        // camadas em vez de descartá-las (mesmo bug de raiz do item 6,
        // agora pro separador "+").
        const partes = up.split("+");
        const baseTok = partes[0];
        let outBase = "0";
        if(baseTok==="N") outBase = "N";
        else if(/^\d+$/.test(baseTok)) outBase = String(parseInt(baseTok,10));
        const outExtras = [];
        const vistas = new Set();
        for(const extra of partes.slice(1)){
          if(extra.length>=2 && (extra[0]==="L"||extra[0]==="B"||extra[0]==="P") && /^\d+$/.test(extra.slice(1)) && !vistas.has(extra[0])){
            vistas.add(extra[0]);
            outExtras.push(extra[0]+parseInt(extra.slice(1),10));
          }
        }
        outRow.push([outBase, ...outExtras].join("+"));
      } else if(up.length>=2 && up[0]==="L" && /^\d+$/.test(up.slice(1))){
        const n = parseInt(up.slice(1),10);
        outRow.push("L"+n);
      } else if(up.length>=2 && up[0]==="B" && /^\d+$/.test(up.slice(1))){
        const n = parseInt(up.slice(1),10);
        outRow.push("B"+n);
      } else if(up.length>=2 && up[0]==="P" && /^\d+$/.test(up.slice(1))){
        const n = parseInt(up.slice(1),10);
        outRow.push("P"+n);
      } else if(up==="N"){
        outRow.push("N");
      } else if(/^\d+$/.test(tok)){
        const d = parseInt(tok,10);
        if(!isNew && d>=7){
          const n = d-6;
          legacyLightRemap[d]=n;
          outRow.push("L"+n);
        } else {
          outRow.push(String(d));
        }
      } else {
        outRow.push("0");
      }
    }
    grid.push(outRow);
  }
  return {grid, isNew, legacyLightRemap};
}

function loadRcfg(text){
  const dados = parseSections(text);
  if(!dados.MAP || !dados.MAP.length) throw new Error("nenhum mapa encontrado (seção [MAP])");
  const width = dados.MAP[0].length;
  for(let i=0;i<dados.MAP.length;i++){
    if(dados.MAP[i].length!==width) throw new Error(`linha ${i+1} tem ${dados.MAP[i].length} colunas, o mapa precisa de ${width}`);
  }
  const {grid, isNew, legacyLightRemap} = processMapTokens(dados.MAP);

  const s = freshState();
  s.map = grid;

  const cfg = dados.CONFIG || {};
  const [w,h] = (cfg.window||"960 560").split(/\s+/);
  s.config.window_w = parseInt(w)||960; s.config.window_h = parseInt(h)||560;
  s.config.mm = parseInt(cfg.mm ?? 140);
  s.config.fov = parseFloat(cfg.fov ?? 60);
  s.config.num_rays = parseInt(cfg.num_rays ?? 180);
  s.config.max_depth = parseInt(cfg.max_depth ?? 30);
  s.config.move_speed = parseFloat(cfg.move_speed ?? 0.06);
  s.config.run_multiplier = parseFloat(cfg.run_multiplier ?? 1.8);
  s.config.mouse_sens_x = parseFloat(cfg.mouse_sens_x ?? 0.004);
  s.config.mouse_sens_y = parseFloat(cfg.mouse_sens_y ?? 1.0);
  s.config.max_look_y = parseInt(cfg.max_look_y ?? 240);
  s.config.fog = parseFloat(cfg.fog ?? 1.4);
  s.config.gradient_steps = parseInt(cfg.gradient_steps ?? 14);
  s.config.ambient = parseFloat(cfg.ambient ?? 0.07);
  s.config.floor_bands = parseInt(cfg.floor_bands ?? 4);
  s.config.floor_step = parseInt(cfg.floor_step ?? 2);
  let lr = parseInt(cfg.light_res ?? 1);
  if(!LIGHT_RES_VALIDOS.includes(lr)) lr = LIGHT_RES_VALIDOS.reduce((a,b)=>Math.abs(b-lr)<Math.abs(a-lr)?b:a);
  s.config.light_res = lr;
  s.config.light_soft_samples = parseInt(cfg.light_soft_samples ?? 6);
  s.config.light_soft_radius = parseFloat(cfg.light_soft_radius ?? 0.4);
  s.config.light_bounce = parseFloat(cfg.light_bounce ?? 0.35);
  s.config.light_bounce_radius = parseFloat(cfg.light_bounce_radius ?? 1.6);
  s.config.light_bounce_passes = Math.max(1, parseInt(cfg.light_bounce_passes ?? 2));
  s.config.texture_size = Math.max(2, parseInt(cfg.texture_size ?? 256));
  s.config.wall_scale = parseFloat(cfg.wall_scale ?? 1.0);

  const sp = dados.SPAWN || {};
  s.spawn = {x: parseFloat(sp.x ?? 1.5), y: parseFloat(sp.y ?? 1.5), angle: parseFloat(sp.angle ?? 0)};

  s.info = Object.entries(dados.INFO||{}).map(([k,v])=>[k.toUpperCase(), v]);
  if(!s.info.length) s.info = [["NAME",""],["AUTHOR",""]];

  s.colors = {};
  for(const [tipo,valor] of Object.entries(dados.COLORS||{})){
    const partes = valor.split(/[\s,]+/).filter(Boolean);
    if(partes.length>=2) s.colors[parseInt(tipo)] = [normColor(partes[0]), normColor(partes[1])];
  }

  s.textures = {};
  for(const [tipo,valor] of Object.entries(dados.TEXTURES||{})){
    if(valor.trim()) s.textures[parseInt(tipo)] = valor.trim();
  }

  s.lights = {};
  for(const [tipoRaw,valor] of Object.entries(dados.LIGHTS||{})){
    const partes = valor.split(/[\s,]+/).filter(Boolean);
    const cor = partes[0] ? normColor(partes[0]) : "#ffcc88";
    const raio = partes[1] ? parseFloat(partes[1]) : 4.0;
    let n = parseInt(tipoRaw);
    if(!isNew && legacyLightRemap[n]!==undefined) n = legacyLightRemap[n];
    s.lights[n] = [cor, raio];
  }

  s.theme = {};
  for(const [k,v] of Object.entries(dados.THEME||{})){
    s.theme[k] = THEME_KEYS.includes(k) ? normColor(v) : v;
  }

  s.title = (dados.TITLE && dados.TITLE.value) || "";

  s.billboards = {};
  for(const [tipo,valor] of Object.entries(dados.BILLBOARDS||{})){
    const partes = valor.split(/[\s,]+/).filter(Boolean);
    const caminho = partes[0]||"";
    const offset = partes[1] ? parseFloat(partes[1]) : 0.0;
    const escala = partes[2] ? parseFloat(partes[2]) : 1.0;
    if(caminho) s.billboards[parseInt(tipo)] = [caminho, offset, escala];
  }

  s.sky = {...DEFAULT_SKY};
  const skySec = dados.SKY || {};
  // "enabled" = presença da seção: é assim que a engine decide se desenha
  // sol/lua/estrelas (sky["enabled"] = bool(dados["SKY"])).
  s.sky.enabled = Object.keys(skySec).length > 0;
  s.sky.cycle = ["1","true","yes"].includes(String(skySec.cycle||"").trim().toLowerCase());
  // Clamps espelham _parse_sky() da engine: day_length >= 1, hora % 24,
  // sun_peak 10..90, stars >= 0. Sem isso o editor mostraria um valor que a
  // engine troca na carga (ex.: DAY_LENGTH 0 vira 1, STARS -5 vira 0).
  s.sky.day_length = Math.max(1, parseFloat(skySec.day_length ?? DEFAULT_SKY.day_length));
  s.sky.start_time = parseFloat(skySec.start_time ?? DEFAULT_SKY.start_time) % 24;
  s.sky.sun_peak = Math.max(10, Math.min(90, parseFloat(skySec.sun_peak ?? DEFAULT_SKY.sun_peak)));
  s.sky.sun_color = normColor(skySec.sun_color || DEFAULT_SKY.sun_color);
  s.sky.moon_color = normColor(skySec.moon_color || DEFAULT_SKY.moon_color);
  s.sky.stars = Math.max(0, parseInt(skySec.stars ?? DEFAULT_SKY.stars));

  s.particles = {};
  for(const [tipo,valor] of Object.entries(dados.PARTICLES||{})){
    const partes = valor.split(/[\s,]+/).filter(Boolean);
    const caminho = partes[0]||"";
    const quantidade = partes[1] ? parseInt(partes[1]) : DEFAULT_PARTICLE[1];
    const velocidade = partes[2] ? parseFloat(partes[2]) : DEFAULT_PARTICLE[2];
    const espalhamento = partes[3] ? parseFloat(partes[3]) : DEFAULT_PARTICLE[3];
    if(caminho) s.particles[parseInt(tipo)] = [caminho, quantidade, velocidade, espalhamento];
  }

  return s;
}

function normColor(t){
  t = t.trim().replace(/^#/,"");
  if(/^[0-9a-fA-F]{6}$/.test(t)) return "#"+t.toLowerCase();
  return "#ffffff";
}

/* ───────────────────────── SERIALIZER ───────────────────────── */

function serializeRcfg(s){
  const L = [];
  L.push("# Gerado pelo RCFG Editor");
  L.push("[CONFIG]");
  L.push(`WINDOW ${s.config.window_w} ${s.config.window_h}`);
  L.push(`MM ${s.config.mm}`);
  L.push(`FOV ${s.config.fov}`);
  L.push(`NUM_RAYS ${s.config.num_rays}`);
  L.push(`MAX_DEPTH ${s.config.max_depth}`);
  L.push(`MOVE_SPEED ${s.config.move_speed}`);
  L.push(`RUN_MULTIPLIER ${s.config.run_multiplier}`);
  L.push(`MOUSE_SENS_X ${s.config.mouse_sens_x}`);
  L.push(`MOUSE_SENS_Y ${s.config.mouse_sens_y}`);
  L.push(`MAX_LOOK_Y ${s.config.max_look_y}`);
  L.push(`FOG ${s.config.fog}`);
  L.push(`GRADIENT_STEPS ${s.config.gradient_steps}`);
  L.push(`AMBIENT ${s.config.ambient}`);
  L.push(`FLOOR_BANDS ${s.config.floor_bands}`);
  L.push(`FLOOR_STEP ${s.config.floor_step}`);
  L.push(`LIGHT_RES ${s.config.light_res}`);
  L.push(`LIGHT_SOFT_SAMPLES ${s.config.light_soft_samples}`);
  L.push(`LIGHT_SOFT_RADIUS ${s.config.light_soft_radius}`);
  L.push(`LIGHT_BOUNCE ${s.config.light_bounce}`);
  L.push(`LIGHT_BOUNCE_RADIUS ${s.config.light_bounce_radius}`);
  L.push(`LIGHT_BOUNCE_PASSES ${s.config.light_bounce_passes}`);
  L.push(`TEXTURE_SIZE ${s.config.texture_size}`);
  L.push(`WALL_SCALE ${s.config.wall_scale}`);
  L.push("");
  L.push("[SPAWN]");
  L.push(`X ${s.spawn.x}`);
  L.push(`Y ${s.spawn.y}`);
  L.push(`ANGLE ${s.spawn.angle}`);
  L.push("");
  if(s.info.length){
    L.push("[INFO]");
    for(const [k,v] of s.info) if(k.trim()) L.push(`${k.trim().toUpperCase()} ${v}`);
    L.push("");
  }
  const colorKeys = Object.keys(s.colors).map(Number).sort((a,b)=>a-b);
  if(colorKeys.length){
    L.push("[COLORS]");
    for(const t of colorKeys) L.push(`${t} ${s.colors[t][0]} ${s.colors[t][1]}`);
    L.push("");
  }
  const lightKeys = Object.keys(s.lights).map(Number).sort((a,b)=>a-b);
  if(lightKeys.length){
    L.push("[LIGHTS]");
    for(const n of lightKeys) L.push(`${n} ${s.lights[n][0]} ${s.lights[n][1]}`);
    L.push("");
  }
  const texKeys = Object.keys(s.textures).map(Number).sort((a,b)=>a-b);
  if(texKeys.length){
    L.push("[TEXTURES]");
    for(const t of texKeys) if(s.textures[t]) L.push(`${t} ${s.textures[t]}`);
    L.push("");
  }
  const themeKeys = Object.keys(s.theme).filter(k=>s.theme[k]);
  if(themeKeys.length){
    L.push("[THEME]");
    for(const k of themeKeys) L.push(`${k.toUpperCase()} ${s.theme[k]}`);
    L.push("");
  }
  if(s.sky && s.sky.enabled){
    // Normalização igual à da engine (_parse_sky) para o arquivo salvo nunca
    // carregar "diferente" do que o editor mostra: DAY_LENGTH >= 1, hora % 24,
    // SUN_PEAK 10..90, STARS >= 0.
    L.push("[SKY]");
    L.push(`CYCLE ${s.sky.cycle ? "true" : "false"}`);
    L.push(`DAY_LENGTH ${Math.max(1, parseFloat(s.sky.day_length))}`);
    L.push(`START_TIME ${parseFloat(s.sky.start_time) % 24}`);
    L.push(`SUN_PEAK ${Math.max(10, Math.min(90, parseFloat(s.sky.sun_peak)))}`);
    L.push(`SUN_COLOR ${s.sky.sun_color}`);
    L.push(`MOON_COLOR ${s.sky.moon_color}`);
    L.push(`STARS ${Math.max(0, parseInt(s.sky.stars))}`);
    L.push("");
  }
  if(s.title && s.title.trim()){
    L.push("[TITLE]");
    L.push(s.title.trim());
    L.push("");
  }
  const bbKeys = Object.keys(s.billboards).map(Number).sort((a,b)=>a-b);
  if(bbKeys.length){
    L.push("[BILLBOARDS]");
    for(const n of bbKeys){
      const [path, off, scale] = s.billboards[n];
      if(path) L.push(`${n} ${path} ${off} ${scale ?? 1.0}`);
    }
    L.push("");
  }
  const particleKeys = Object.keys(s.particles||{}).map(Number).sort((a,b)=>a-b);
  if(particleKeys.length){
    L.push("[PARTICLES]");
    for(const n of particleKeys){
      const [path, qty, vel, spread] = s.particles[n];
      if(path) L.push(`${n} ${path} ${qty} ${vel} ${spread}`);
    }
    L.push("");
  }
  L.push("[MAP]");
  for(const row of s.map) L.push(row.join(" "));
  L.push("");
  return L.join("\n");
}

/* ───────────────────────── PALETTE / TOOLS ───────────────────────── */

function paletteHTML(){

  const mk = (kind,n,label,swatchColor)=>{

    div.dataset.kind = kind; div.dataset.n = n;
    div.innerHTML = `<span class="swatch" style="background:${swatchColor}"></span>
      <span class="lab">${label}</span>`;
    div.onclick = ()=>{ tool = {kind, n}; paletteHTML(); };
    el.appendChild(div);
  };
  const h = (t)=>{ const hh=document.createElement("h2"); hh.textContent=t; el.appendChild(hh); };

  h("Terreno");
  mk("empty",0,"Vazio (0)","#0c0a08");
  mk("invisible",0,"Barreira invisível (N)","#161310");

  h("Paredes 1–9");
  for(let n=1;n<=9;n++){
    const c = state.colors[n] ? state.colors[n][0] : "#333";
    mk("wall",n,`Parede ${n}`,c);
  }

  h("Luzes L1–L9");

  }

  h("Billboards B1–B9");

  }

    "Ctrl+roda = zoom no cursor<br>"+
    "Botão direito = apaga só a camada da ferramenta ativa";
  el.appendChild(hint);
}

function parseToken(tok){
  // Divide um token do [MAP] em {base, extras}: base é "0"/dígito/"N", extras
  // é um objeto {L?:n, B?:n, P?:n} — no máx. 1 índice por letra (item 4).
  const parts = String(tok).split("+");
  let base = parts[0];
  const extras = {};
  for(const p of parts.slice(1)){
    if(p.length>=2 && "LBP".includes(p[0]) && /^\d+$/.test(p.slice(1))) extras[p[0]] = parseInt(p.slice(1),10);
  }
  // formato antigo/solto: token inteiro é "L#"/"B#"/"P#" sem "+" → base implícita "0"
  if(base.length>=2 && "LBP".includes(base[0]) && /^\d+$/.test(base.slice(1))){
    extras[base[0]] = parseInt(base.slice(1),10);
    base = "0";
  }
  return {base, extras};
}
function composeToken(base, extras){
  const parts = [base];
  for(const L of ["L","B","P"]) if(extras[L]!=null) parts.push(L+extras[L]);
  return parts.join("+");
}
function tokenFor(kind,n){
  if(kind==="empty") return "0";
  if(kind==="invisible") return "N";
  if(kind==="wall") return String(n);
  if(kind==="light") return "L"+n;
  if(kind==="billboard") return "B"+n;
  if(kind==="particle") return "P"+n;
  return "0";
}
// Pinta a ferramenta atual em cima do token existente, preservando as
// camadas que não pertencem à ferramenta selecionada (PLANO.md item 4):
// ferramentas de Terreno (empty/wall/invisible) só mexem na base; ferramentas
// de camada (light/billboard/particle) só adicionam/removem seu próprio "+X".
function applyPaint(oldTok, kind, n, erase){
  const {base, extras} = parseToken(oldTok);
  if(kind==="empty" || kind==="wall" || kind==="invisible"){
    const newBase = erase ? "0" : (kind==="invisible" ? "N" : kind==="wall" ? String(n) : "0");
    return composeToken(newBase, extras);
  }
  const letter = kind==="light" ? "L" : kind==="billboard" ? "B" : "P";
  const newExtras = {...extras};
  if(erase) delete newExtras[letter]; else newExtras[letter] = n;
  return composeToken(base, newExtras);
}

/* ───────────────────────── CANVAS ───────────────────────── */

const canvas = document.getElementById("mapcanvas");
const ctx = canvas.getContext("2d", {alpha:false});
const wrap = document.getElementById("canvaswrap");
const spacer = document.getElementById("mapspacer");
let cell = 26;
let scrollX = 0, scrollY = 0;
let rafPending = false;

/* ─── viewport-culled rendering: só desenhamos as células visíveis.
   Isso é o que permite mapas gigantes (milhares de células) sem travar
   e sem esbarrar no limite de dimensão de <canvas> de alguns navegadores
   (o canvas real tem só o tamanho da área visível). ─── */

function resizeCanvasToViewport(){
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if(canvas.width!==w || canvas.height!==h){
    canvas.width = w; canvas.height = h;
  }
}

function scheduleDraw(){
  if(rafPending) return;
  rafPending = true;
  requestAnimationFrame(()=>{ rafPending=false; drawViewport(); });
}

// desenha o conteúdo de uma célula (assume que ctx já está com o transform certo)
function renderCellShape(i,j){
  const {base, extras} = parseToken(state.map[j][i]);
  const tok = base;
  const x=i*cell, y=j*cell;
  const extraList = ["L","B","P"].filter(L=>extras[L]!=null);
  if(tok==="0"){
    ctx.fillStyle = ((i+j)%2===0) ? "#161310" : "#131009";
    ctx.fillRect(x,y,cell,cell);
  } else if(/^\d$/.test(tok)){
    const c = state.colors[parseInt(tok)] ? state.colors[parseInt(tok)][0] : "#555";
    ctx.fillStyle = c;
    ctx.fillRect(x,y,cell,cell);
    ctx.strokeStyle = "#0006"; ctx.strokeRect(x+.5,y+.5,cell-1,cell-1);
  } else if(tok[0]==="L"){
    ctx.fillStyle = "#161310"; ctx.fillRect(x,y,cell,cell);
    const n = tok.slice(1);
    const c = state.lights[n] ? state.lights[n][0] : "#ffdd88";
    ctx.beginPath();
    ctx.arc(x+cell/2, y+cell/2, cell*0.32, 0, Math.PI*2);
    ctx.fillStyle = c; ctx.globalAlpha=0.85; ctx.fill(); ctx.globalAlpha=1;
    ctx.strokeStyle="#fff8"; ctx.stroke();
  } else if(tok[0]==="B"){
    ctx.fillStyle = "#161310"; ctx.fillRect(x,y,cell,cell);
    ctx.strokeStyle="#e0a458"; ctx.lineWidth=1.5;
    ctx.strokeRect(x+cell*0.2,y+cell*0.15,cell*0.6,cell*0.7);
    ctx.lineWidth=1;
  } else if(tok==="N"){
    ctx.fillStyle = "#161310"; ctx.fillRect(x,y,cell,cell);
    ctx.strokeStyle="#7fb0ff"; ctx.lineWidth=1; ctx.globalAlpha=0.7;
    ctx.strokeRect(x+1.5,y+1.5,cell-3,cell-3);
    ctx.setLineDash([3,3]);
    ctx.strokeRect(x+1.5,y+1.5,cell-3,cell-3);
    ctx.setLineDash([]);
    ctx.globalAlpha=1;
  }
  extraList.forEach((letter,k)=>{
    const cor = letter==="L" ? "#ffdd88" : letter==="B" ? "#e0a458" : "#7fd8b0";
    ctx.fillStyle = cor;
    ctx.beginPath(); ctx.arc(x+cell*(0.18+k*0.22), y+cell*0.18, cell*0.1, 0, Math.PI*2); ctx.fill();
  });
  ctx.strokeStyle="#000000"; ctx.globalAlpha=0.35;
  ctx.strokeRect(x+.5,y+.5,cell-1,cell-1);
  ctx.globalAlpha=1;
}

function drawSpawnMarker(i0,j0,i1,j1){
  const si = Math.floor(state.spawn.x), sj = Math.floor(state.spawn.y);
  if(si<i0-1||si>i1||sj<j0-1||sj>j1) return;
  const sx = state.spawn.x*cell, sy = state.spawn.y*cell;
  ctx.fillStyle = "#5fd8d0";
  ctx.beginPath(); ctx.arc(sx,sy,cell*0.18,0,Math.PI*2); ctx.fill();
  const ang = state.spawn.angle*Math.PI/180;
  ctx.strokeStyle="#5fd8d0"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(sx,sy);
  ctx.lineTo(sx+Math.cos(ang)*cell*0.5, sy+Math.sin(ang)*cell*0.5);
  ctx.stroke(); ctx.lineWidth=1;
}

function drawMap(){
  cell = Math.max(4, parseInt(document.getElementById("zoomInput").value)||26);
  const rows = state.map.length, cols = state.map[0]?.length||0;
  spacer.style.width = (cols*cell)+"px";
  spacer.style.height = (rows*cell)+"px";
  document.getElementById("rowsInput").value = rows;
  document.getElementById("colsInput").value = cols;
  scheduleDraw();
}

function drawViewport(){
  resizeCanvasToViewport();
  const rows = state.map.length, cols = state.map[0]?.length||0;
  scrollX = wrap.scrollLeft; scrollY = wrap.scrollTop;
  ctx.setTransform(1,0,0,1,-scrollX,-scrollY);
  ctx.fillStyle = "#0c0a08";
  ctx.fillRect(scrollX, scrollY, canvas.width, canvas.height);

  const i0 = Math.max(0, Math.floor(scrollX/cell)-1);
  const j0 = Math.max(0, Math.floor(scrollY/cell)-1);
  const i1 = Math.min(cols, Math.ceil((scrollX+canvas.width)/cell)+1);
  const j1 = Math.min(rows, Math.ceil((scrollY+canvas.height)/cell)+1);

  for(let j=j0;j<j1;j++) for(let i=i0;i<i1;i++) renderCellShape(i,j);
  drawSpawnMarker(i0,j0,i1,j1);
}

// redesenha a célula (i,j) e suas vizinhas para não "cortar" marcadores/luzes que vazam de borda
function drawCell(i, j) {
  const rows = state.map.length, cols = state.map[0]?.length || 0;
  
  const i0 = Math.max(0, i - 1);
  const j0 = Math.max(0, j - 1);
  const i1 = Math.min(cols - 1, i + 1);
  const j1 = Math.min(rows - 1, j + 1);

  ctx.setTransform(1, 0, 0, 1, -scrollX, -scrollY);

  // limpa e desenha o fundo/terreno de toda a vizinhança afetada
  for (let cJ = j0; cJ <= j1; cJ++) {
    for (let cI = i0; cI <= i1; cI++) {
      ctx.clearRect(cI * cell, cJ * cell, cell, cell);
      renderCellShape(cI, cJ);
    }
  }

  // redesenha o marcador do player garantindo que não fique "comido"
  drawSpawnMarker(i0, j0, i1, j1);
}

wrap.addEventListener("scroll", scheduleDraw, {passive:true});
new ResizeObserver(scheduleDraw).observe(wrap);

function cellFromEvent(e){
  const rect = canvas.getBoundingClientRect();
  const worldX = (e.clientX-rect.left) + scrollX;
  const worldY = (e.clientY-rect.top) + scrollY;
  return {i: Math.floor(worldX/cell), j: Math.floor(worldY/cell)};
}

function bumpStat(tok, delta){
  const {base, extras} = parseToken(tok);
  if(/^\d+$/.test(base) && base!=="0"){
    document.getElementById("statWalls").textContent = (parseInt(document.getElementById("statWalls").textContent)||0)+delta;
  }
  if(extras.L!=null){
    document.getElementById("statLights").textContent = (parseInt(document.getElementById("statLights").textContent)||0)+delta;
  }
  if(extras.B!=null){
    document.getElementById("statBB").textContent = (parseInt(document.getElementById("statBB").textContent)||0)+delta;
  }
  if(extras.P!=null){
    document.getElementById("statP").textContent = (parseInt(document.getElementById("statP").textContent)||0)+delta;
  }
}

function computeStats(){
  let w=0,l=0,b=0,p=0;
  for(const row of state.map) for(const tok of row){
    const {base, extras} = parseToken(tok);
    if(/^\d+$/.test(base) && base!=="0") w++;
    if(extras.L!=null) l++;
    if(extras.B!=null) b++;
    if(extras.P!=null) p++;
  }
  document.getElementById("statWalls").textContent = w;
  document.getElementById("statLights").textContent = l;
  document.getElementById("statBB").textContent = b;
  document.getElementById("statP").textContent = p;
}

/* ─── undo/redo por stroke (agrupa todas as células alteradas entre
   mousedown e mouseup num único passo de undo, barato mesmo em mapas grandes) ─── */
let undoStack = [], redoStack = [];
let currentStroke = null;

function beginStroke(){ currentStroke = new Map(); }
function recordChange(i,j,before){
  const key = i+","+j;
  if(!currentStroke.has(key)) currentStroke.set(key, {i,j,before});
}
function endStroke(){
  if(currentStroke && currentStroke.size){
    undoStack.push(currentStroke);
    if(undoStack.length>200) undoStack.shift();
    redoStack = [];
  }
  currentStroke = null;
}
function applyStroke(stroke, useAfter){
  const touched = [];
  for(const {i,j,before,after} of stroke.values ? stroke.values() : stroke){
    const val = useAfter ? after : before;
    bumpStat(state.map[j][i], -1);
    state.map[j][i] = val;
    bumpStat(val, 1);
    touched.push([i,j]);
  }
  for(const [i,j] of touched) drawCell(i,j);
}
function undo(){
  if(!undoStack.length) return;
  const stroke = undoStack.pop();
  // completa "after" com o valor atual antes de reverter
  for(const rec of stroke.values()) rec.after = state.map[rec.j][rec.i];
  applyStroke(stroke, false);
  redoStack.push(stroke);
  toast("Desfeito");
}
function redo(){
  if(!redoStack.length) return;
  const stroke = redoStack.pop();
  applyStroke(stroke, true);
  undoStack.push(stroke);
  toast("Refeito");
}

function paintAt(i,j,erase){
  const rows=state.map.length, cols=state.map[0]?.length||0;
  if(i<0||j<0||i>=cols||j>=rows) return;
  const old = state.map[j][i];
  const val = applyPaint(old, tool.kind, tool.n, erase);
  if(old===val) return; // nada mudou, evita redraw à toa
  if(currentStroke) recordChange(i,j,old);
  bumpStat(old,-1);
  state.map[j][i] = val;
  bumpStat(val,1);
  drawCell(i,j);
}

function fillRect(i0,j0,i1,j1,erase){
  const rows=state.map.length, cols=state.map[0]?.length||0;
  const lo_i=Math.max(0,Math.min(i0,i1)), hi_i=Math.min(cols-1,Math.max(i0,i1));
  const lo_j=Math.max(0,Math.min(j0,j1)), hi_j=Math.min(rows-1,Math.max(j0,j1));
  for(let j=lo_j;j<=hi_j;j++) for(let i=lo_i;i<=hi_i;i++){
    const old = state.map[j][i];
    const val = applyPaint(old, tool.kind, tool.n, erase);
    if(old===val) continue;
    if(currentStroke) recordChange(i,j,old);
    bumpStat(old,-1); state.map[j][i]=val; bumpStat(val,1);
  }
  scheduleDraw();
}

let dragStart = null; // {i,j} quando shift+arraste pra retângulo
let hoverEl = document.getElementById("hoverCoord");

canvas.addEventListener("mousedown", e=>{
  if (e.button !== 0 && e.button !== 2) return;
  painting = true;
  // Botão 0 (Esquerdo): pinta a ferramenta selecionada.
  // Botão 2 (Direito): apaga só a camada da ferramenta selecionada
  // (base -> "0"; light/billboard/particle -> remove o "+X" daquela letra).
  paintErase = (e.button === 2);
  beginStroke();
  const {i,j} = cellFromEvent(e);
  lastMousePos = {i, j};
  if(e.shiftKey){ dragStart = {i,j}; }
  else { dragStart=null; paintAt(i,j,paintErase); }
});

canvas.addEventListener("mousemove", e=>{
  const {i,j} = cellFromEvent(e);
  lastMousePos = {i, j};
  const rows=state.map.length, cols=state.map[0]?.length||0;
  hoverEl.textContent = (i>=0&&j>=0&&i<cols&&j<rows) ? `(${i}, ${j})` : "—";
  if(!painting) return;
  if(dragStart){
    scheduleDraw(); // redesenha viewport puro; overlay do retângulo abaixo
    requestAnimationFrame(()=>{
      ctx.setTransform(1,0,0,1,-scrollX,-scrollY);
      const x0=Math.min(dragStart.i,i)*cell, y0=Math.min(dragStart.j,j)*cell;
      const x1=(Math.max(dragStart.i,i)+1)*cell, y1=(Math.max(dragStart.j,j)+1)*cell;
      ctx.strokeStyle="#e0a458"; ctx.lineWidth=2;
      ctx.strokeRect(x0+1,y0+1,x1-x0-2,y1-y0-2);
      ctx.lineWidth=1;
    });
  } else {
    paintAt(i,j,paintErase);
  }
});
canvas.addEventListener("mouseleave", ()=>{ hoverEl.textContent="—"; });

// Handler unificado de mouseup para evitar conflitos de escopo e ordem
window.addEventListener("mouseup", e=>{
  if(painting){
    if(dragStart){
      fillRect(dragStart.i, dragStart.j, lastMousePos.i, lastMousePos.j, paintErase);
    }
    painting = false;
    dragStart = null;
    endStroke();
  }
});

// Previne o menu de contexto padrão do botão direito no canvas
canvas.addEventListener("contextmenu", e=>{
  e.preventDefault();
});

// zoom com roda do mouse (Ctrl/Cmd + roda), centrado no cursor
canvas.addEventListener("wheel", e=>{
  if(!(e.ctrlKey||e.metaKey)) return;
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const worldX = (e.clientX-rect.left)+scrollX, worldY = (e.clientY-rect.top)+scrollY;
  const fx = worldX/cell, fy = worldY/cell; // posição em coordenadas de célula
  const zoomInput = document.getElementById("zoomInput");
  let newCell = cell + (e.deltaY<0 ? 2 : -2);
  newCell = Math.max(4, Math.min(48, newCell));
  zoomInput.value = newCell;
  cell = newCell;
  const rows = state.map.length, cols = state.map[0]?.length||0;
  spacer.style.width=(cols*cell)+"px"; spacer.style.height=(rows*cell)+"px";
  wrap.scrollLeft = fx*cell - (e.clientX-rect.left);
  wrap.scrollTop = fy*cell - (e.clientY-rect.top);
  scheduleDraw();
}, {passive:false});

document.getElementById("zoomInput").oninput = drawMap;
document.getElementById("btnFit").onclick = ()=>{
  const rows = state.map.length, cols = state.map[0]?.length||0;
  const availW = wrap.clientWidth-4, availH = wrap.clientHeight-4;
  let z = Math.floor(Math.min(availW/cols, availH/rows));
  z = Math.max(4, Math.min(48, z||26));
  document.getElementById("zoomInput").value = z;
  drawMap();
};

document.getElementById("btnResize").onclick = ()=>{
  const newRows = Math.max(1, Math.min(4000, parseInt(document.getElementById("rowsInput").value)||state.map.length));
  const newCols = Math.max(1, Math.min(4000, parseInt(document.getElementById("colsInput").value)||state.map[0].length));
  if(newRows*newCols > 1000000 && !confirm(`Isso cria um mapa com ${newRows*newCols.toLocaleString?newRows*newCols:newRows*newCols} células. Mapas muito grandes usam mais memória e podem deixar o carregamento no jogo mais lento. Continuar?`)) return;
  const oldRows = state.map.length, oldCols = state.map[0].length;
  const g = [];
  for(let j=0;j<newRows;j++){
    const row=[];
    for(let i=0;i<newCols;i++){
      if(j<oldRows && i<oldCols){
        row.push(state.map[j][i]);
      } else {
        // célula nova: se cair na borda externa do mapa redimensionado,
        // vira parede (igual a um mapa novo) pra não deixar o mapa "aberto"
        const onNewBorder = (i===0 || j===0 || i===newCols-1 || j===newRows-1);
        row.push(onNewBorder ? "1" : "0");
      }
    }
    g.push(row);
  }
  state.map = g;
  undoStack=[]; redoStack=[];
  computeStats();
  drawMap();
  toast(`Mapa redimensionado para ${newCols}×${newRows}`);
};

/* ─── atalhos de teclado ───
   0-9 = seleciona parede/vazio · Delete/Backspace = ferramenta vazio
   Ctrl+Z = desfazer · Ctrl+Y / Ctrl+Shift+Z = refazer */
window.addEventListener("keydown", e=>{
  const tgt = e.target;
  if(tgt && (tgt.tagName==="INPUT" || tgt.tagName==="TEXTAREA")) return;
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z"){
    e.preventDefault();
    if(e.shiftKey) redo(); else undo();
    return;
  }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="y"){
    e.preventDefault(); redo(); return;
  }
  if(e.key>="0" && e.key<="9"){
    const n = parseInt(e.key);
    tool = n===0 ? {kind:"empty",n:0} : {kind:"wall", n};
    paletteHTML();
  } else if(e.key==="Delete" || e.key==="Backspace"){
    tool = {kind:"empty", n:0}; paletteHTML();
  }
});

function field(label, value, onChange, opts={}){
  const wrap = document.createElement("div"); wrap.className="field";
  const lab = document.createElement("label"); lab.textContent = label;
  const inp = document.createElement("input");
  inp.type = opts.type || "text";
  if(opts.step) inp.step = opts.step;
  if(opts.min !== undefined) inp.min = opts.min;
  if(opts.max !== undefined) inp.max = opts.max;
  inp.value = value;
  inp.oninput = ()=> onChange(opts.type==="number" ? parseFloat(inp.value) : inp.value);
  // Clamp no blur para os limites ficarem visíveis logo ao sair do campo
  // (sem atrapalhar a digitação): número fora de min/max é corrigido na hora.
  if(opts.type==="number"){
    inp.onblur = ()=>{
      let v = parseFloat(inp.value);
      if(Number.isNaN(v)) v = opts.min !== undefined ? parseFloat(opts.min) : 0;
      if(opts.min !== undefined && v < parseFloat(opts.min)) v = parseFloat(opts.min);
      if(opts.max !== undefined && v > parseFloat(opts.max)) v = parseFloat(opts.max);
      inp.value = v;
      onChange(v);
    };
  }
  wrap.appendChild(lab); wrap.appendChild(inp);
  return wrap;
}

function colorField(label, value, onChange){
  const wrap = document.createElement("div"); wrap.className="field";
  const lab = document.createElement("label"); lab.textContent = label;
  const row = document.createElement("div"); row.style.display="flex"; row.style.gap="6px";
  const inp = document.createElement("input"); inp.type="text"; inp.value=value; inp.style.flex="1";
  const cp = document.createElement("input"); cp.type="color"; cp.value=/^#[0-9a-f]{6}$/i.test(value)?value:"#888888";
  cp.style.width="36px"; cp.style.padding="0"; cp.style.border="1px solid var(--line)";
  inp.oninput = ()=>{ onChange(inp.value); cp.value=/^#[0-9a-f]{6}$/i.test(inp.value)?inp.value:cp.value; };
  cp.oninput = ()=>{ inp.value=cp.value; onChange(cp.value); };
  row.appendChild(inp); row.appendChild(cp);
  wrap.appendChild(lab); wrap.appendChild(row);
  return wrap;
}

function checkField(label, value, onChange){
  const wrap = document.createElement("div"); wrap.className="field";
  const row = document.createElement("div"); row.style.display="flex"; row.style.alignItems="center"; row.style.gap="6px";
  const inp = document.createElement("input"); inp.type="checkbox"; inp.checked=!!value;
  inp.onchange = ()=> onChange(inp.checked);
  const lab = document.createElement("label"); lab.textContent = label; lab.style.margin="0"; lab.style.cursor="pointer";
  row.appendChild(inp); row.appendChild(lab);
  wrap.appendChild(row);
  return wrap;
}

/* ───────────────────────── TOP BAR ACTIONS ───────────────────────── */

function toast(msg){
  const el = document.getElementById("status");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove("show"), 2200);
}

document.getElementById("btnNew").onclick = ()=>{
  if(!confirm("Descartar o mapa atual e começar um novo?")) return;
  state = freshState(); tool={kind:"wall",n:1};
  undoStack=[]; redoStack=[];
  paletteHTML(); computeStats(); drawMap(); renderPanels();
  toast("Novo mapa criado");
};

document.getElementById("btnLoad").onclick = ()=>document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange = (e)=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      state = loadRcfg(reader.result);
      undoStack=[]; redoStack=[];
      paletteHTML(); computeStats(); drawMap(); renderPanels();
      toast(`Carregado: ${file.name}`);
    }catch(err){
      alert("Erro ao carregar .rcfg: " + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = "";
};

document.getElementById("btnExport").onclick = ()=>{
  const text = serializeRcfg(state);
  const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = (state.title.replace(/[^\w\-]+/g,"_").replace(/^_+|_+$/g,"") || "mapa") + ".rcfg";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("Arquivo .rcfg baixado");
};

/* ───────────────────────── INIT ───────────────────────── */
paletteHTML();
computeStats();
drawMap();
renderPanels();
