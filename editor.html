<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>RCFG Editor — Raycasting Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#12100e; --panel:#1a1714; --panel2:#211d19; --line:#332c26;
    --text:#e8e0d4; --dim:#9a8f80; --amber:#e0a458; --amber-dim:#8a6a3a;
    --cyan:#5fd8d0; --danger:#c9564f; --mono:'JetBrains Mono','Consolas',monospace;
    --serif:'Georgia','Times New Roman',serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:var(--mono);font-size:13px;}
  body{display:flex;flex-direction:column;}

  header{display:flex;align-items:center;gap:14px;padding:10px 16px;
    background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;}
  header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;
    color:var(--amber);letter-spacing:.3px;}
  header .sub{color:var(--dim);font-size:11px;margin-top:1px;}
  header .grow{flex:1;}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:6px 12px;border-radius:3px;font-family:var(--mono);font-size:12px;
    cursor:pointer;transition:border-color .15s;}
  .btn:hover{border-color:var(--amber-dim);}
  .btn.primary{background:var(--amber);color:#1a1410;border-color:var(--amber);font-weight:600;}
  .btn.primary:hover{background:#eab674;}
  .btn.danger{border-color:var(--danger);color:var(--danger);}
  input[type=file]{display:none;}

  main{flex:1;display:flex;min-height:0;}

  /* ---- left: palette ---- */
  #palette{width:168px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
    padding:12px;overflow-y:auto;}
  #palette h2{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);
    margin:14px 0 6px;}
  #palette h2:first-child{margin-top:0;}
  .tool{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:3px;
    cursor:pointer;border:1px solid transparent;margin-bottom:2px;}
  .tool:hover{background:var(--panel2);}
  .tool.active{border-color:var(--amber);background:#2a2118;}
  .swatch{width:16px;height:16px;border-radius:3px;border:1px solid #0006;flex-shrink:0;}
  .tool .lab{font-size:12px;}
  .tool .lab .k{color:var(--dim);font-size:10px;}

  /* ---- center: canvas ---- */
  #stage{flex:1;display:flex;flex-direction:column;min-width:0;}
  #stagebar{display:flex;align-items:center;gap:10px;padding:8px 14px;
    background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;flex-wrap:wrap;}
  #stagebar label{color:var(--dim);font-size:11px;}
  #stagebar input[type=number]{width:52px;background:var(--bg);border:1px solid var(--line);
    color:var(--text);padding:4px 6px;border-radius:3px;font-family:var(--mono);}
  #canvaswrap{flex:1;overflow:auto;position:relative;background:
    radial-gradient(circle at 50% 0%, #1c1815, var(--bg));}
  #mapspacer{position:absolute;top:0;left:0;pointer-events:none;width:1px;height:1px;}
  #mapcanvas{background:#0c0a08;image-rendering:pixelated;
    cursor:none;position:sticky;top:0;left:0;display:block;}
  #stagebar .stat{color:var(--dim);font-size:11px;}
  #stagebar .stat b{color:var(--cyan);font-weight:600;}
  #hoverCoord{color:var(--dim);font-size:11px;min-width:64px;}

  /* ---- right: inspector ---- */
  #inspector{width:340px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;}
  #tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);flex-shrink:0;}
  #tabs button{flex:1 1 auto;background:none;border:none;color:var(--dim);padding:8px 4px;
    font-family:var(--mono);font-size:10.5px;cursor:pointer;border-bottom:2px solid transparent;
    letter-spacing:.3px;}
  #tabs button:hover{color:var(--text);}
  #tabs button.active{color:var(--amber);border-bottom-color:var(--amber);}
  #panels{flex:1;overflow-y:auto;padding:14px;}
  .panel{display:none;}
  .panel.active{display:block;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:11px;color:var(--dim);margin-bottom:3px;}
  .field input[type=text],.field input[type=number],.field textarea{
    width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
    padding:6px 8px;border-radius:3px;font-family:var(--mono);font-size:12px;}
  .field textarea{resize:vertical;min-height:50px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  fieldset{border:1px solid var(--line);border-radius:4px;margin:0 0 14px;padding:10px;}
  fieldset legend{color:var(--amber);font-size:11px;padding:0 6px;text-transform:uppercase;
    letter-spacing:.5px;}
  .entry{border:1px solid var(--line);border-radius:4px;padding:8px;margin-bottom:8px;
    background:var(--panel2);}
  .entry-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .entry-head span{color:var(--cyan);font-size:11px;font-weight:600;}
  .rm{background:none;border:none;color:var(--dim);cursor:pointer;font-size:14px;
    line-height:1;padding:0 4px;}
  .rm:hover{color:var(--danger);}
  .addbtn{width:100%;background:var(--panel2);border:1px dashed var(--line);color:var(--dim);
    padding:8px;border-radius:4px;cursor:pointer;font-family:var(--mono);font-size:11px;}
  .addbtn:hover{border-color:var(--amber-dim);color:var(--amber);}
  .hint{color:var(--dim);font-size:10.5px;line-height:1.5;margin-top:8px;}
  #status{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
    background:#1a1714;border:1px solid var(--amber-dim);color:var(--amber);
    padding:8px 16px;border-radius:4px;font-size:12px;opacity:0;pointer-events:none;
    transition:opacity .2s;z-index:99;}
  #status.show{opacity:1;}
  #status.error{border-color:var(--danger);color:var(--danger);}
</style>
</head>
<body>

<header>
  <div>
    <h1>RCFG Editor</h1>
    <div class="sub">editor visual standalone · Raycasting Engine</div>
  </div>
  <div class="grow"></div>
  <button class="btn" id="btnNew">Novo mapa</button>
  <button class="btn" id="btnLoad">Abrir .rcfg</button>
  <input type="file" id="fileInput" accept=".rcfg,.txt">
  <button class="btn primary" id="btnExport">Baixar .rcfg</button>
</header>

<main>
  <div id="palette"></div>

  <div id="stage">
    <div id="stagebar">
      <label>Linhas</label><input type="number" id="rowsInput" min="1" max="4000">
      <label>Colunas</label><input type="number" id="colsInput" min="1" max="4000">
      <button class="btn" id="btnResize" title="Redimensionar mapa">📐</button>
      <label style="margin-left:10px">Zoom</label>
      <input type="number" id="zoomInput" min="4" max="48" value="26" style="width:44px">
      <button class="btn" id="btnFit" title="Ajustar zoom pra caber na tela">🔍</button>
      <label style="margin-left:10px">Pincel</label>
      <input type="number" id="brushInput" min="1" max="9" value="1" style="width:38px" title="Tamanho do pincel (NxN)">
      <button class="btn" id="btnFillMode" title="Alternar balde de tinta (F)">🪣</button>
      <button class="btn" id="btnMirrorH" title="Espelhar seleção copiada horizontalmente">⇋</button>
      <button class="btn" id="btnMirrorV" title="Espelhar seleção copiada verticalmente">⇅</button>
      <button class="btn" id="btnRotate" title="Girar seleção copiada 90°">⟳</button>
      <div class="grow"></div>
      <span id="hoverCoord">—</span>
      <span class="stat">Paredes: <b id="statWalls">0</b></span>
      <span class="stat">Luzes: <b id="statLights">0</b></span>
      <span class="stat">Billboards: <b id="statBB">0</b></span>
      <span class="stat">Partículas: <b id="statP">0</b></span>
    </div>
    <div id="canvaswrap"><div id="mapspacer"></div><canvas id="mapcanvas"></canvas></div>
  </div>

  <div id="inspector">
    <div id="tabs"></div>
    <div id="panels"></div>
  </div>
</main>

<div id="status"></div>

<script>
const DEFAULT_CONFIG = {
  window_w:960, window_h:560, mm:140, fov:60, num_rays:200, max_depth:30,
  move_speed:0.035, run_multiplier:1.8, mouse_sens_x:0.004, mouse_sens_y:1.0,
  max_look_y:240, fog:1.4, gradient_steps:14, ambient:0.07, floor_bands:3,
  floor_step:2, light_res:1, light_soft_samples:6, light_soft_radius:0.4,
  light_bounce:0.35, light_bounce_radius:1.6, light_bounce_passes:2, texture_size:256,
  wall_scale:1, bob_enabled:true, bob_amount:8, bob_speed:10
};
const LIGHT_RES_VALIDOS = [1,2,4,8,16,32];
const THEME_KEYS = ["sky_base","sky_top","floor_base","floor_top","crosshair",
  "hud_light","hud_alert","minimap_player"];
const DEFAULT_WALL_COLORS = ["#7a6a55","#5590c8","#4caf6b","#c85a8a","#9a6ac8","#c8935a",
  "#c8b45a","#5ac8b0","#c85a5a"];
const DEFAULT_SKY = {enabled:false, cycle:false, day_length:120, start_time:8,
  sun_peak:45, sun_color:"#fff2c0", moon_color:"#b9c6e0", stars:140};
const DEFAULT_SPAWN = {x:1.5, y:1.5, angle:0};
const DEFAULT_LIGHT = {color:"#ffcc88", radius:4.0};
const DEFAULT_BB_SPEED = 0.06;
const DEFAULT_BILLBOARD = ["", 0.0, 1.0, "none", DEFAULT_BB_SPEED];
const DEFAULT_BB_SOUND = {radius:8.0, volume:1.0};
const DEFAULT_PARTICLE = ["", 8, 0.5, 0.4, 0.0, 1.0];

function blankMap(rows, cols){
  const g = [];
  for(let j=0;j<rows;j++){
    const row=[];
    for(let i=0;i<cols;i++){
      const border = (i===0||j===0||i===cols-1||j===rows-1);
      row.push(border ? "1" : "0");
    }
    g.push(row);
  }
  return g;
}

function freshState(){
  return {
    config: {...DEFAULT_CONFIG},
    spawn: {...DEFAULT_SPAWN},
    info: [["NAME","Novo Mapa"], ["AUTHOR",""]],
    colors: {1:["#7a6a55","#5a4d3d"]},
    textures: {},
    lights: {1:["#fff8e7", 4.0]},
    theme: {sky_base:"#1a1a3a", sky_top:"#4a3b6e", floor_base:"#1e1e24",
            floor_top:"#3a3a4d", crosshair:"#00ffff", hud_light:"#00ffcc",
            hud_alert:"#ffcc00", minimap_player:"#00ffff"},
    title: "🔮 Novo Mapa",
    billboards: {},
    sky: {...DEFAULT_SKY},
    particles: {},
    bbSounds: {},
    map: blankMap(10,12),
  };
}

let state = freshState();
let tool = {kind:"wall", n:1};
let painting = false;
let paintErase = false;
let lastMousePos = {i: 0, j: 0};
let brushSize = 1;
let fillMode = false;
let clipboard = null; // {w,h,cells:[[tok,...],...]}
let selection = null; // {i0,j0,i1,j1} confirmed selection
let selecting = null;  // {i0,j0} while dragging a new selection
let hoverHighlight = null; // {kind,n} from palette hover
let spaceDown = false;
let panning = false;
let panStart = null; // {x,y,scrollLeft,scrollTop}
let pastePreview = false;
let hovering = false;
const AUTOSAVE_KEY = "rcfg_editor_autosave_v1";

/* ───────────────────────── PARSER (mirror _parse_sections) ───────────────────────── */

function stripComment(line){
  if(line.replace(/^\s+/,"").startsWith("#")) return "";
  const m = line.match(/(?:\s#(?=\s)|#\s*$)/);
  if(m) return line.slice(0, m.index);
  return line;
}

function parseSections(text){
  const lines = text.split(/\r?\n/);
  let section = null;
  const dados = {};
  for(let raw of lines){
    let linha = stripComment(raw).replace(/\s+$/,"");
    if(!linha.trim()) continue;
    const stripped = linha.trim();
    if(stripped.startsWith("[") && stripped.endsWith("]")){
      section = stripped.slice(1,-1).trim().toUpperCase();
      dados[section] = (section==="MAP") ? [] : {};
      continue;
    }
    if(section===null) continue;
    if(section==="MAP"){
      const celulas = stripped.split(/[\s,;]+/).filter(Boolean);
      dados.MAP.push(celulas);
    } else if(section==="TITLE"){
      dados.TITLE.value = stripped;
    } else {
      const m = stripped.match(/^(\S+)[\s,]+(.*)$/);
      let chave, valor;
      if(m){ chave = m[1].toLowerCase(); valor = m[2].trim(); }
      else { chave = stripped.toLowerCase(); valor = ""; }
      dados[section][chave] = valor;
    }
  }
  return dados;
}

function processMapTokens(rawRows){
  const grid = [];
  for(const row of rawRows){
    const outRow = [];
    for(const tok of row){
      const up = tok.toUpperCase();
      if(up.includes("+")){
        const partes = up.split("+");
        const baseTok = partes[0];
        let outBase = "0";
        if(baseTok==="N") outBase = "N";
        else if(/^\d+$/.test(baseTok)) outBase = String(parseInt(baseTok,10));
        const outExtras = [];
        const vistas = new Set();
        for(const extra of partes.slice(1)){
          if(extra.length>=2 && (extra[0]==="L"||extra[0]==="B"||extra[0]==="P") && /^\d+$/.test(extra.slice(1)) && !vistas.has(extra[0])){
            vistas.add(extra[0]);
            outExtras.push(extra[0]+parseInt(extra.slice(1),10));
          }
        }
        outRow.push([outBase, ...outExtras].join("+"));
      } else if(up==="N"){
        outRow.push("N");
      } else if(/^\d+$/.test(tok)){
        outRow.push(String(parseInt(tok,10)));
      } else {
        outRow.push("0");
      }
    }
    grid.push(outRow);
  }
  return {grid};
}

function loadRcfg(text){
  const dados = parseSections(text);
  if(!dados.MAP || !dados.MAP.length) throw new Error("nenhum mapa encontrado (seção [MAP])");
  const width = dados.MAP[0].length;
  for(let i=0;i<dados.MAP.length;i++){
    if(dados.MAP[i].length!==width) throw new Error(`linha ${i+1} tem ${dados.MAP[i].length} colunas, o mapa precisa de ${width}`);
  }
  const {grid} = processMapTokens(dados.MAP);

  const s = freshState();
  s.map = grid;

  const cfg = dados.CONFIG || {};
  const [w,h] = (cfg.window||`${DEFAULT_CONFIG.window_w} ${DEFAULT_CONFIG.window_h}`).split(/\s+/);
  s.config.window_w = parseInt(w)||DEFAULT_CONFIG.window_w; s.config.window_h = parseInt(h)||DEFAULT_CONFIG.window_h;
  s.config.mm = parseInt(cfg.mm ?? DEFAULT_CONFIG.mm);
  s.config.fov = parseFloat(cfg.fov ?? DEFAULT_CONFIG.fov);
  s.config.num_rays = parseInt(cfg.num_rays ?? DEFAULT_CONFIG.num_rays);
  s.config.max_depth = parseInt(cfg.max_depth ?? DEFAULT_CONFIG.max_depth);
  s.config.move_speed = parseFloat(cfg.move_speed ?? DEFAULT_CONFIG.move_speed);
  s.config.run_multiplier = parseFloat(cfg.run_multiplier ?? DEFAULT_CONFIG.run_multiplier);
  s.config.mouse_sens_x = parseFloat(cfg.mouse_sens_x ?? DEFAULT_CONFIG.mouse_sens_x);
  s.config.mouse_sens_y = parseFloat(cfg.mouse_sens_y ?? DEFAULT_CONFIG.mouse_sens_y);
  s.config.max_look_y = parseInt(cfg.max_look_y ?? DEFAULT_CONFIG.max_look_y);
  s.config.bob_enabled = String(cfg.bob_enabled ?? DEFAULT_CONFIG.bob_enabled).trim().toLowerCase()==="true";
  s.config.bob_amount = parseFloat(cfg.bob_amount ?? DEFAULT_CONFIG.bob_amount);
  s.config.bob_speed = parseFloat(cfg.bob_speed ?? DEFAULT_CONFIG.bob_speed);
  s.config.fog = parseFloat(cfg.fog ?? DEFAULT_CONFIG.fog);
  s.config.gradient_steps = parseInt(cfg.gradient_steps ?? DEFAULT_CONFIG.gradient_steps);
  s.config.ambient = parseFloat(cfg.ambient ?? DEFAULT_CONFIG.ambient);
  s.config.floor_bands = parseInt(cfg.floor_bands ?? DEFAULT_CONFIG.floor_bands);
  s.config.floor_step = parseInt(cfg.floor_step ?? DEFAULT_CONFIG.floor_step);
  let lr = parseInt(cfg.light_res ?? DEFAULT_CONFIG.light_res);
  if(!LIGHT_RES_VALIDOS.includes(lr)) lr = LIGHT_RES_VALIDOS.reduce((a,b)=>Math.abs(b-lr)<Math.abs(a-lr)?b:a);
  s.config.light_res = lr;
  s.config.light_soft_samples = parseInt(cfg.light_soft_samples ?? DEFAULT_CONFIG.light_soft_samples);
  s.config.light_soft_radius = parseFloat(cfg.light_soft_radius ?? DEFAULT_CONFIG.light_soft_radius);
  s.config.light_bounce = parseFloat(cfg.light_bounce ?? DEFAULT_CONFIG.light_bounce);
  s.config.light_bounce_radius = parseFloat(cfg.light_bounce_radius ?? DEFAULT_CONFIG.light_bounce_radius);
  s.config.light_bounce_passes = Math.max(1, parseInt(cfg.light_bounce_passes ?? DEFAULT_CONFIG.light_bounce_passes));
  s.config.texture_size = Math.max(2, parseInt(cfg.texture_size ?? DEFAULT_CONFIG.texture_size));
  s.config.wall_scale = parseFloat(cfg.wall_scale ?? DEFAULT_CONFIG.wall_scale);

  const sp = dados.SPAWN || {};
  s.spawn = {x: parseFloat(sp.x ?? DEFAULT_SPAWN.x), y: parseFloat(sp.y ?? DEFAULT_SPAWN.y), angle: parseFloat(sp.angle ?? DEFAULT_SPAWN.angle)};

  s.info = Object.entries(dados.INFO||{}).map(([k,v])=>[k.toUpperCase(), v]);
  if(!s.info.length) s.info = [["NAME",""],["AUTHOR",""]];

  s.colors = {};
  for(const [tipo,valor] of Object.entries(dados.COLORS||{})){
    const partes = valor.split(/[\s,]+/).filter(Boolean);
    if(partes.length>=2) s.colors[parseInt(tipo)] = [normColor(partes[0]), normColor(partes[1])];
  }

  s.textures = {};
  for(const [tipo,valor] of Object.entries(dados.TEXTURES||{})){
    if(valor.trim()) s.textures[parseInt(tipo)] = valor.trim();
  }

  s.lights = {};
  for(const [tipoRaw,valor] of Object.entries(dados.LIGHTS||{})){
    const partes = valor.split(/[\s,]+/).filter(Boolean);
    const cor = partes[0] ? normColor(partes[0]) : DEFAULT_LIGHT.color;
    const raio = partes[1] ? parseFloat(partes[1]) : DEFAULT_LIGHT.radius;
    const n = parseInt(tipoRaw);
    s.lights[n] = [cor, raio];
  }

  s.theme = {};
  for(const [k,v] of Object.entries(dados.THEME||{})){
    s.theme[k] = THEME_KEYS.includes(k) ? normColor(v) : v;
  }

  s.title = (dados.TITLE && dados.TITLE.value) || "";

  s.billboards = {};
  for(const [tipo,valor] of Object.entries(dados.BILLBOARDS||{})){
    const partes = valor.split(/[\s,]+/).filter(Boolean);
    const caminho = partes[0]||"";
    const offset = partes[1] ? parseFloat(partes[1]) : DEFAULT_BILLBOARD[1];
    const escala = partes[2] ? parseFloat(partes[2]) : DEFAULT_BILLBOARD[2];
    let ai = (partes[3]||DEFAULT_BILLBOARD[3]).toLowerCase();
    if(!["none","friendly","enemy"].includes(ai)) ai = DEFAULT_BILLBOARD[3];
    let speed = partes[4] ? parseFloat(partes[4]) : NaN;
    if(!isFinite(speed) || speed <= 0) speed = DEFAULT_BB_SPEED;
    if(caminho) s.billboards[parseInt(tipo)] = [caminho, offset, escala, ai, speed];
  }

  s.sky = {...DEFAULT_SKY};
  const skySec = dados.SKY || {};
  s.sky.enabled = Object.keys(skySec).length > 0;
  s.sky.cycle = ["1","true","yes"].includes(String(skySec.cycle||"").trim().toLowerCase());
  s.sky.day_length = Math.max(1, parseFloat(skySec.day_length ?? DEFAULT_SKY.day_length));
  s.sky.start_time = parseFloat(skySec.start_time ?? DEFAULT_SKY.start_time) % 24;
  s.sky.sun_peak = Math.max(10, Math.min(90, parseFloat(skySec.sun_peak ?? DEFAULT_SKY.sun_peak)));
  s.sky.sun_color = normColor(skySec.sun_color || DEFAULT_SKY.sun_color);
  s.sky.moon_color = normColor(skySec.moon_color || DEFAULT_SKY.moon_color);
  s.sky.stars = Math.max(0, parseInt(skySec.stars ?? DEFAULT_SKY.stars));

  s.particles = {};
  for(const [tipo,valor] of Object.entries(dados.PARTICLES||{})){
    const partes = valor.split(/[\s,]+/).filter(Boolean);
    const caminho = partes[0]||"";
    const quantidade = partes[1] ? parseInt(partes[1]) : DEFAULT_PARTICLE[1];
    const velocidade = partes[2] ? parseFloat(partes[2]) : DEFAULT_PARTICLE[2];
    const espalhamento = partes[3] ? parseFloat(partes[3]) : DEFAULT_PARTICLE[3];
    const offsetY = partes[4] ? parseFloat(partes[4]) : DEFAULT_PARTICLE[4];
    const escala = partes[5] ? parseFloat(partes[5]) : DEFAULT_PARTICLE[5];
    if(caminho) s.particles[parseInt(tipo)] = [caminho, quantidade, velocidade, espalhamento, offsetY, escala];
  }

  s.bbSounds = {};
  for(const [tipo,valor] of Object.entries(dados["BILLBOARD_SOUNDS"]||{})){
    const partes = valor.split(/[\s,]+/).filter(Boolean);
    const caminho = partes[0]||"";
    const raio = partes[1] ? parseFloat(partes[1]) : DEFAULT_BB_SOUND.radius;
    let volume = partes[2] ? parseFloat(partes[2]) : DEFAULT_BB_SOUND.volume;
    if(!isFinite(volume)) volume = DEFAULT_BB_SOUND.volume;
    volume = Math.max(0, Math.min(10, volume));
    if(caminho) s.bbSounds[parseInt(tipo)] = [caminho, raio, volume];
  }

  return s;
}

function normColor(t){
  t = t.trim().replace(/^#/,"");
  if(/^[0-9a-fA-F]{6}$/.test(t)) return "#"+t.toLowerCase();
  return "#ffffff";
}

/* ───────────────────────── SERIALIZER ───────────────────────── */

function serializeRcfg(s){
  const L = [];
  L.push("# Gerado pelo RCFG Editor");
  L.push("[CONFIG]");
  L.push(`WINDOW ${s.config.window_w} ${s.config.window_h}`);
  L.push(`MM ${s.config.mm}`);
  L.push(`FOV ${s.config.fov}`);
  L.push(`NUM_RAYS ${s.config.num_rays}`);
  L.push(`MAX_DEPTH ${s.config.max_depth}`);
  L.push(`MOVE_SPEED ${s.config.move_speed}`);
  L.push(`RUN_MULTIPLIER ${s.config.run_multiplier}`);
  L.push(`MOUSE_SENS_X ${s.config.mouse_sens_x}`);
  L.push(`MOUSE_SENS_Y ${s.config.mouse_sens_y}`);
  L.push(`MAX_LOOK_Y ${s.config.max_look_y}`);
  L.push(`BOB_ENABLED ${s.config.bob_enabled}`);
  L.push(`BOB_AMOUNT ${s.config.bob_amount}`);
  L.push(`BOB_SPEED ${s.config.bob_speed}`);
  L.push(`FOG ${s.config.fog}`);
  L.push(`GRADIENT_STEPS ${s.config.gradient_steps}`);
  L.push(`AMBIENT ${s.config.ambient}`);
  L.push(`FLOOR_BANDS ${s.config.floor_bands}`);
  L.push(`FLOOR_STEP ${s.config.floor_step}`);
  L.push(`LIGHT_RES ${s.config.light_res}`);
  L.push(`LIGHT_SOFT_SAMPLES ${s.config.light_soft_samples}`);
  L.push(`LIGHT_SOFT_RADIUS ${s.config.light_soft_radius}`);
  L.push(`LIGHT_BOUNCE ${s.config.light_bounce}`);
  L.push(`LIGHT_BOUNCE_RADIUS ${s.config.light_bounce_radius}`);
  L.push(`LIGHT_BOUNCE_PASSES ${s.config.light_bounce_passes}`);
  L.push(`TEXTURE_SIZE ${s.config.texture_size}`);
  L.push(`WALL_SCALE ${s.config.wall_scale}`);
  L.push("");
  L.push("[SPAWN]");
  L.push(`X ${s.spawn.x}`);
  L.push(`Y ${s.spawn.y}`);
  L.push(`ANGLE ${s.spawn.angle}`);
  L.push("");
  if(s.info.length){
    L.push("[INFO]");
    for(const [k,v] of s.info) if(k.trim()) L.push(`${k.trim().toUpperCase()} ${v}`);
    L.push("");
  }
  const colorKeys = Object.keys(s.colors).map(Number).sort((a,b)=>a-b);
  if(colorKeys.length){
    L.push("[COLORS]");
    for(const t of colorKeys) L.push(`${t} ${s.colors[t][0]} ${s.colors[t][1]}`);
    L.push("");
  }
  const lightKeys = Object.keys(s.lights).map(Number).sort((a,b)=>a-b);
  if(lightKeys.length){
    L.push("[LIGHTS]");
    for(const n of lightKeys) L.push(`${n} ${s.lights[n][0]} ${s.lights[n][1]}`);
    L.push("");
  }
  const texKeys = Object.keys(s.textures).map(Number).sort((a,b)=>a-b);
  if(texKeys.length){
    L.push("[TEXTURES]");
    for(const t of texKeys) if(s.textures[t]) L.push(`${t} ${s.textures[t]}`);
    L.push("");
  }
  const themeKeys = Object.keys(s.theme).filter(k=>s.theme[k]);
  if(themeKeys.length){
    L.push("[THEME]");
    for(const k of themeKeys) L.push(`${k.toUpperCase()} ${s.theme[k]}`);
    L.push("");
  }
  if(s.sky && s.sky.enabled){
    L.push("[SKY]");
    L.push(`CYCLE ${s.sky.cycle ? "true" : "false"}`);
    L.push(`DAY_LENGTH ${Math.max(1, parseFloat(s.sky.day_length))}`);
    L.push(`START_TIME ${parseFloat(s.sky.start_time) % 24}`);
    L.push(`SUN_PEAK ${Math.max(10, Math.min(90, parseFloat(s.sky.sun_peak)))}`);
    L.push(`SUN_COLOR ${s.sky.sun_color}`);
    L.push(`MOON_COLOR ${s.sky.moon_color}`);
    L.push(`STARS ${Math.max(0, parseInt(s.sky.stars))}`);
    L.push("");
  }
  if(s.title && s.title.trim()){
    L.push("[TITLE]");
    L.push(s.title.trim());
    L.push("");
  }
  const bbKeys = Object.keys(s.billboards).map(Number).sort((a,b)=>a-b);
  if(bbKeys.length){
    L.push("[BILLBOARDS]");
    for(const n of bbKeys){
      const [path, off, scale, ai, speed] = s.billboards[n];
      if(path) L.push(`${n} ${path} ${off} ${scale ?? DEFAULT_BILLBOARD[2]} ${ai ?? DEFAULT_BILLBOARD[3]} ${speed ?? DEFAULT_BB_SPEED}`);
    }
    L.push("");
  }
  const bbSoundKeys = Object.keys(s.bbSounds||{}).map(Number).sort((a,b)=>a-b);
  if(bbSoundKeys.length){
    L.push("[BILLBOARD_SOUNDS]");
    for(const n of bbSoundKeys){
      const [path, raio, volume] = s.bbSounds[n];
      if(path) L.push(`${n} ${path} ${raio ?? DEFAULT_BB_SOUND.radius} ${volume ?? DEFAULT_BB_SOUND.volume}`);
    }
    L.push("");
  }
  const particleKeys = Object.keys(s.particles||{}).map(Number).sort((a,b)=>a-b);
  if(particleKeys.length){
    L.push("[PARTICLES]");
    for(const n of particleKeys){
      const [path, qty, vel, spread, offsetY, escala] = s.particles[n];
      if(path) L.push(`${n} ${path} ${qty} ${vel} ${spread} ${offsetY ?? DEFAULT_PARTICLE[4]} ${escala ?? DEFAULT_PARTICLE[5]}`);
    }
    L.push("");
  }
  L.push("[MAP]");
  for(const row of s.map) L.push(row.join(" "));
  L.push("");
  return L.join("\n");
}

function parseToken(tok){
  const parts = String(tok).split("+");
  const base = parts[0];
  const extras = {};
  for(const p of parts.slice(1)){
    if(p.length>=2 && "LBP".includes(p[0]) && /^\d+$/.test(p.slice(1))) extras[p[0]] = parseInt(p.slice(1),10);
  }
  return {base, extras};
}
function composeToken(base, extras){
  const parts = [base];
  for(const L of ["L","B","P"]) if(extras[L]!=null) parts.push(L+extras[L]);
  return parts.join("+");
}
function tokenFor(kind,n){
  if(kind==="empty") return "0";
  if(kind==="invisible") return "N";
  if(kind==="wall") return String(n);
  if(kind==="light") return "L"+n;
  if(kind==="billboard") return "B"+n;
  if(kind==="particle") return "P"+n;
  return "0";
}
function applyPaint(oldTok, kind, n, erase){
  const {base, extras} = parseToken(oldTok);
  if(kind==="empty" || kind==="wall" || kind==="invisible"){
    const newBase = erase ? "0" : (kind==="invisible" ? "N" : kind==="wall" ? String(n) : "0");
    return composeToken(newBase, extras);
  }
  const letter = kind==="light" ? "L" : kind==="billboard" ? "B" : "P";
  const newExtras = {...extras};
  if(erase) delete newExtras[letter]; else newExtras[letter] = n;
  return composeToken(base, newExtras);
}

/* ───────────────────────── CANVAS ───────────────────────── */

const canvas = document.getElementById("mapcanvas");
const ctx = canvas.getContext("2d", {alpha:false});
const wrap = document.getElementById("canvaswrap");
const spacer = document.getElementById("mapspacer");
let cell = 26;
let scrollX = 0, scrollY = 0;
let rafPending = false;

function resizeCanvasToViewport(){
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if(canvas.width!==w || canvas.height!==h){
    canvas.width = w; canvas.height = h;
  }
}

function scheduleDraw(){
  if(rafPending) return;
  rafPending = true;
  requestAnimationFrame(()=>{ rafPending=false; drawViewport(); });
}

function renderCellShape(i,j){
  const {base, extras} = parseToken(state.map[j][i]);
  const tok = base;
  const x=i*cell, y=j*cell;
  const extraList = ["L","B","P"].filter(L=>extras[L]!=null);
  if(tok==="0"){
    ctx.fillStyle = ((i+j)%2===0) ? "#161310" : "#131009";
    ctx.fillRect(x,y,cell,cell);
  } else if(/^\d$/.test(tok)){
    const c = state.colors[parseInt(tok)] ? state.colors[parseInt(tok)][0] : "#555";
    ctx.fillStyle = c;
    ctx.fillRect(x,y,cell,cell);
    ctx.strokeStyle = "#0006"; ctx.strokeRect(x+.5,y+.5,cell-1,cell-1);
  } else if(tok[0]==="L"){
    ctx.fillStyle = "#161310"; ctx.fillRect(x,y,cell,cell);
    const n = tok.slice(1);
    const c = state.lights[n] ? state.lights[n][0] : "#ffdd88";
    ctx.beginPath();
    ctx.arc(x+cell/2, y+cell/2, cell*0.32, 0, Math.PI*2);
    ctx.fillStyle = c; ctx.globalAlpha=0.85; ctx.fill(); ctx.globalAlpha=1;
    ctx.strokeStyle="#fff8"; ctx.stroke();
  } else if(tok[0]==="B"){
    ctx.fillStyle = "#161310"; ctx.fillRect(x,y,cell,cell);
    ctx.strokeStyle="#e0a458"; ctx.lineWidth=1.5;
    ctx.strokeRect(x+cell*0.2,y+cell*0.15,cell*0.6,cell*0.7);
    ctx.lineWidth=1;
  } else if(tok==="N"){
    ctx.fillStyle = "#161310"; ctx.fillRect(x,y,cell,cell);
    ctx.strokeStyle="#7fb0ff"; ctx.lineWidth=1; ctx.globalAlpha=0.7;
    ctx.strokeRect(x+1.5,y+1.5,cell-3,cell-3);
    ctx.setLineDash([3,3]);
    ctx.strokeRect(x+1.5,y+1.5,cell-3,cell-3);
    ctx.setLineDash([]);
    ctx.globalAlpha=1;
  }
  extraList.forEach((letter,k)=>{
    const cor = letter==="L" ? "#ffdd88" : letter==="B" ? "#e0a458" : "#7fd8b0";
    ctx.fillStyle = cor;
    ctx.beginPath(); ctx.arc(x+cell*(0.18+k*0.22), y+cell*0.18, cell*0.1, 0, Math.PI*2); ctx.fill();
  });
  ctx.strokeStyle="#000000"; ctx.globalAlpha=0.35;
  ctx.strokeRect(x+.5,y+.5,cell-1,cell-1);
  ctx.globalAlpha=1;
}

function drawSpawnMarker(i0,j0,i1,j1){
  const si = Math.floor(state.spawn.x), sj = Math.floor(state.spawn.y);
  if(si<i0-1||si>i1||sj<j0-1||sj>j1) return;
  const sx = state.spawn.x*cell, sy = state.spawn.y*cell;
  ctx.fillStyle = "#5fd8d0";
  ctx.beginPath(); ctx.arc(sx,sy,cell*0.18,0,Math.PI*2); ctx.fill();
  const ang = state.spawn.angle*Math.PI/180;
  ctx.strokeStyle="#5fd8d0"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(sx,sy);
  ctx.lineTo(sx+Math.cos(ang)*cell*0.5, sy+Math.sin(ang)*cell*0.5);
  ctx.stroke(); ctx.lineWidth=1;
}

function drawMap(){
  cell = Math.max(4, parseInt(document.getElementById("zoomInput").value)||26);
  const rows = state.map.length, cols = state.map[0]?.length||0;
  spacer.style.width = (cols*cell)+"px";
  spacer.style.height = (rows*cell)+"px";
  document.getElementById("rowsInput").value = rows;
  document.getElementById("colsInput").value = cols;
  scheduleDraw();
}

function drawHoverHighlightRange(i0,j0,i1,j1){
  if(!hoverHighlight) return;
  ctx.strokeStyle = "#5fd8d0"; ctx.lineWidth = 2;
  for(let j=j0;j<j1;j++) for(let i=i0;i<i1;i++){
    const {base, extras} = parseToken(state.map[j][i]);
    const matches = (hoverHighlight.kind==="wall" && base===String(hoverHighlight.n)) ||
      (hoverHighlight.kind==="empty" && base==="0") ||
      (hoverHighlight.kind==="invisible" && base==="N") ||
      (hoverHighlight.kind==="light" && extras.L===hoverHighlight.n) ||
      (hoverHighlight.kind==="billboard" && extras.B===hoverHighlight.n) ||
      (hoverHighlight.kind==="particle" && extras.P===hoverHighlight.n);
    if(matches) ctx.strokeRect(i*cell+1, j*cell+1, cell-2, cell-2);
  }
  ctx.lineWidth = 1;
}

function drawSelectionAndPreview(){
  if(selection || selecting){
    const sel = selecting ? {i0:selecting.i0,j0:selecting.j0,i1:lastMousePos.i,j1:lastMousePos.j} : selection;
    const x0=Math.min(sel.i0,sel.i1)*cell, y0=Math.min(sel.j0,sel.j1)*cell;
    const x1=(Math.max(sel.i0,sel.i1)+1)*cell, y1=(Math.max(sel.j0,sel.j1)+1)*cell;
    ctx.strokeStyle="#5fd8d0"; ctx.lineWidth=2; ctx.setLineDash([5,4]);
    ctx.strokeRect(x0+1,y0+1,x1-x0-2,y1-y0-2);
    ctx.setLineDash([]); ctx.lineWidth=1;
  }

  const preview = computePreviewCells();
  if(preview){
    const px0=preview.i0*cell, py0=preview.j0*cell;
    const px1=(preview.i1+1)*cell, py1=(preview.j1+1)*cell;
    ctx.fillStyle = "#ffffff"; ctx.globalAlpha = 0.12;
    ctx.fillRect(px0, py0, px1-px0, py1-py0);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
    ctx.strokeRect(px0+1, py0+1, px1-px0-2, py1-py0-2);
    ctx.lineWidth = 1;
  }
}

function drawViewport(){
  resizeCanvasToViewport();
  const rows = state.map.length, cols = state.map[0]?.length||0;
  scrollX = wrap.scrollLeft; scrollY = wrap.scrollTop;
  ctx.setTransform(1,0,0,1,-scrollX,-scrollY);
  ctx.fillStyle = "#0c0a08";
  ctx.fillRect(scrollX, scrollY, canvas.width, canvas.height);

  const i0 = Math.max(0, Math.floor(scrollX/cell)-1);
  const j0 = Math.max(0, Math.floor(scrollY/cell)-1);
  const i1 = Math.min(cols, Math.ceil((scrollX+canvas.width)/cell)+1);
  const j1 = Math.min(rows, Math.ceil((scrollY+canvas.height)/cell)+1);

  for(let j=j0;j<j1;j++) for(let i=i0;i<i1;i++) renderCellShape(i,j);
  drawSpawnMarker(i0,j0,i1,j1);
  drawHoverHighlightRange(i0,j0,i1,j1);
  drawSelectionAndPreview();
}

function computePreviewCells(){
  if(!hovering || panning || selecting || dragStart) return null;
  const {i,j} = lastMousePos;
  if(pastePreview && clipboard){
    return {i0:i, j0:j, i1:i+clipboard.w-1, j1:j+clipboard.h-1};
  }
  if(tool.kind==="select" || fillMode){
    return {i0:i, j0:j, i1:i, j1:j};
  }
  const {r0,r1} = brushOffsets();
  return {i0:i-r0, j0:j-r0, i1:i+r1, j1:j+r1};
}

function drawCell(i, j) {
  const rows = state.map.length, cols = state.map[0]?.length || 0;
  
  const i0 = Math.max(0, i - 1);
  const j0 = Math.max(0, j - 1);
  const i1 = Math.min(cols - 1, i + 1);
  const j1 = Math.min(rows - 1, j + 1);

  ctx.setTransform(1, 0, 0, 1, -scrollX, -scrollY);

  for (let cJ = j0; cJ <= j1; cJ++) {
    for (let cI = i0; cI <= i1; cI++) {
      ctx.clearRect(cI * cell, cJ * cell, cell, cell);
      renderCellShape(cI, cJ);
    }
  }

  drawSpawnMarker(i0, j0, i1, j1);
  updatePreviewOverlay();
  scheduleDraw();
}

/* ── Preview do pincel sempre em sincronia com a pintura real ──
   O redraw completo (drawViewport) só roda 1x por frame via rAF, mas a
   pintura acontece imediatamente a cada célula. Sem isto, o retângulo
   branco de preview ficava "preso" numa posição antiga por até um frame
   inteiro enquanto o traço real já tinha avançado — um resquício visual
   por cima do que acabou de ser pintado. Por isso o preview é limpo e
   redesenhado manualmente a cada evento de pintura/movimento, nunca
   escondido. */
let lastPreviewRect = null;

function clearPreviewRect(){
  if(!lastPreviewRect) return;
  const rows = state.map.length, cols = state.map[0]?.length || 0;
  const i0 = Math.max(0, lastPreviewRect.i0), j0 = Math.max(0, lastPreviewRect.j0);
  const i1 = Math.min(cols - 1, lastPreviewRect.i1), j1 = Math.min(rows - 1, lastPreviewRect.j1);
  lastPreviewRect = null;
  if(i0 > i1 || j0 > j1) return;
  ctx.setTransform(1, 0, 0, 1, -scrollX, -scrollY);
  for(let j=j0; j<=j1; j++) for(let i=i0; i<=i1; i++){
    ctx.clearRect(i*cell, j*cell, cell, cell);
    renderCellShape(i, j);
  }
  drawSpawnMarker(i0, j0, i1, j1);
}

function drawPreviewRectNow(){
  const preview = computePreviewCells();
  if(!preview){ lastPreviewRect = null; return; }
  ctx.setTransform(1, 0, 0, 1, -scrollX, -scrollY);
  const px0=preview.i0*cell, py0=preview.j0*cell;
  const px1=(preview.i1+1)*cell, py1=(preview.j1+1)*cell;
  ctx.fillStyle = "#ffffff"; ctx.globalAlpha = 0.12;
  ctx.fillRect(px0, py0, px1-px0, py1-py0);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
  ctx.strokeRect(px0+1, py0+1, px1-px0-2, py1-py0-2);
  ctx.lineWidth = 1;
  lastPreviewRect = preview;
}

function updatePreviewOverlay(){
  clearPreviewRect();
  drawPreviewRectNow();
}

wrap.addEventListener("scroll", scheduleDraw, {passive:true});
new ResizeObserver(scheduleDraw).observe(wrap);

function cellFromEvent(e){
  const rect = canvas.getBoundingClientRect();
  const worldX = (e.clientX-rect.left) + scrollX;
  const worldY = (e.clientY-rect.top) + scrollY;
  return {i: Math.floor(worldX/cell), j: Math.floor(worldY/cell)};
}

function inMapBounds(i,j){
  const rows = state.map.length, cols = state.map[0]?.length || 0;
  return i>=0 && j>=0 && i<cols && j<rows;
}

function bumpStat(tok, delta){
  const {base, extras} = parseToken(tok);
  if(/^\d+$/.test(base) && base!=="0"){
    document.getElementById("statWalls").textContent = (parseInt(document.getElementById("statWalls").textContent)||0)+delta;
  }
  if(extras.L!=null){
    document.getElementById("statLights").textContent = (parseInt(document.getElementById("statLights").textContent)||0)+delta;
  }
  if(extras.B!=null){
    document.getElementById("statBB").textContent = (parseInt(document.getElementById("statBB").textContent)||0)+delta;
  }
  if(extras.P!=null){
    document.getElementById("statP").textContent = (parseInt(document.getElementById("statP").textContent)||0)+delta;
  }
}

function computeStats(){
  let w=0,l=0,b=0,p=0;
  for(const row of state.map) for(const tok of row){
    const {base, extras} = parseToken(tok);
    if(/^\d+$/.test(base) && base!=="0") w++;
    if(extras.L!=null) l++;
    if(extras.B!=null) b++;
    if(extras.P!=null) p++;
  }
  document.getElementById("statWalls").textContent = w;
  document.getElementById("statLights").textContent = l;
  document.getElementById("statBB").textContent = b;
  document.getElementById("statP").textContent = p;
}

let undoStack = [], redoStack = [];
let currentStroke = null;

function beginStroke(){ currentStroke = new Map(); }
function recordChange(i,j,before){
  const key = i+","+j;
  if(!currentStroke.has(key)) currentStroke.set(key, {i,j,before});
}
function endStroke(){
  if(currentStroke && currentStroke.size){
    undoStack.push(currentStroke);
    if(undoStack.length>200) undoStack.shift();
    redoStack = [];
    scheduleAutosave();
  }
  currentStroke = null;
}
function applyStroke(stroke, useAfter){
  const touched = [];
  for(const {i,j,before,after} of stroke.values ? stroke.values() : stroke){
    const val = useAfter ? after : before;
    bumpStat(state.map[j][i], -1);
    state.map[j][i] = val;
    bumpStat(val, 1);
    touched.push([i,j]);
  }
  for(const [i,j] of touched) drawCell(i,j);
}
function undo(){
  if(!undoStack.length) return;
  const stroke = undoStack.pop();
  for(const rec of stroke.values()) rec.after = state.map[rec.j][rec.i];
  applyStroke(stroke, false);
  redoStack.push(stroke);
  toast("Desfeito");
}
function redo(){
  if(!redoStack.length) return;
  const stroke = redoStack.pop();
  applyStroke(stroke, true);
  undoStack.push(stroke);
  toast("Refeito");
}

function paintCell(i,j,erase){
  const rows=state.map.length, cols=state.map[0]?.length||0;
  if(i<0||j<0||i>=cols||j>=rows) return;
  const old = state.map[j][i];
  const val = applyPaint(old, tool.kind, tool.n, erase);
  if(old===val) return;
  if(currentStroke) recordChange(i,j,old);
  bumpStat(old,-1);
  state.map[j][i] = val;
  bumpStat(val,1);
  drawCell(i,j);
}

function brushOffsets(){
  const size = Math.max(1, brushSize);
  return {r0: Math.floor((size-1)/2), r1: Math.ceil((size-1)/2)};
}

function paintAt(i,j,erase){
  if(brushSize<=1){ paintCell(i,j,erase); return; }
  const {r0,r1} = brushOffsets();
  for(let dj=-r0; dj<=r1; dj++) for(let di=-r0; di<=r1; di++) paintCell(i+di, j+dj, erase);
}

function floodFill(i0,j0,erase){
  const rows=state.map.length, cols=state.map[0]?.length||0;
  let bi0=0, bj0=0, bi1=cols-1, bj1=rows-1;
  if(selection){
    bi0=Math.max(0,Math.min(selection.i0,selection.i1));
    bj0=Math.max(0,Math.min(selection.j0,selection.j1));
    bi1=Math.min(cols-1,Math.max(selection.i0,selection.i1));
    bj1=Math.min(rows-1,Math.max(selection.j0,selection.j1));
  }
  if(i0<bi0||j0<bj0||i0>bi1||j0>bj1){
    toast(selection ? "Clique dentro da seleção" : "Clique dentro da área do mapa", true);
    return;
  }
  const target = state.map[j0][i0];
  const val = applyPaint(target, tool.kind, tool.n, erase);
  if(target===val) return;
  const stack = [[i0,j0]];
  const seen = new Set([j0*cols+i0]);
  while(stack.length){
    const [i,j] = stack.pop();
    if(i<bi0||j<bj0||i>bi1||j>bj1) continue;
    if(state.map[j][i] !== target) continue;
    if(currentStroke) recordChange(i,j,state.map[j][i]);
    bumpStat(state.map[j][i],-1);
    state.map[j][i] = val;
    bumpStat(val,1);
    drawCell(i,j);
    for(const [di,dj] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const ni=i+di, nj=j+dj, key=nj*cols+ni;
      if(ni>=bi0&&nj>=bj0&&ni<=bi1&&nj<=bj1 && !seen.has(key) && state.map[nj][ni]===target){
        seen.add(key); stack.push([ni,nj]);
      }
    }
  }
}

function floodSelect(i0,j0){
  const rows=state.map.length, cols=state.map[0]?.length||0;
  if(i0<0||j0<0||i0>=cols||j0>=rows){ toast("Clique dentro da área do mapa", true); return; }
  const target = state.map[j0][i0];
  const stack = [[i0,j0]];
  const seen = new Set([j0*cols+i0]);
  let minI=i0, maxI=i0, minJ=j0, maxJ=j0;
  while(stack.length){
    const [i,j] = stack.pop();
    if(i<minI) minI=i; if(i>maxI) maxI=i;
    if(j<minJ) minJ=j; if(j>maxJ) maxJ=j;
    for(const [di,dj] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const ni=i+di, nj=j+dj, key=nj*cols+ni;
      if(ni>=0&&nj>=0&&ni<cols&&nj<rows && !seen.has(key) && state.map[nj][ni]===target){
        seen.add(key); stack.push([ni,nj]);
      }
    }
  }
  selection = {i0:minI, j0:minJ, i1:maxI, j1:maxJ};
  scheduleDraw();
  toast(`Seleção por balde: ${maxI-minI+1}×${maxJ-minJ+1}`);
}

function pickAt(i,j){
  const rows=state.map.length, cols=state.map[0]?.length||0;
  if(i<0||j<0||i>=cols||j>=rows){ toast("Clique dentro da área do mapa", true); return; }
  const {base, extras} = parseToken(state.map[j][i]);
  if(extras.B!=null) tool = {kind:"billboard", n:extras.B};
  else if(extras.P!=null) tool = {kind:"particle", n:extras.P};
  else if(extras.L!=null) tool = {kind:"light", n:extras.L};
  else if(base==="N") tool = {kind:"invisible", n:0};
  else if(base==="0") tool = {kind:"empty", n:0};
  else if(/^\d+$/.test(base)) tool = {kind:"wall", n:parseInt(base,10)};
  paletteHTML();
  toast(`Ferramenta: ${tool.kind}${tool.n?" "+tool.n:""}`);
}

function fillRect(i0,j0,i1,j1,erase,outline){
  const rows=state.map.length, cols=state.map[0]?.length||0;
  const {r0,r1} = brushOffsets();
  const lo_i=Math.max(0,Math.min(i0,i1)-r0), hi_i=Math.min(cols-1,Math.max(i0,i1)+r1);
  const lo_j=Math.max(0,Math.min(j0,j1)-r0), hi_j=Math.min(rows-1,Math.max(j0,j1)+r1);
  for(let j=lo_j;j<=hi_j;j++) for(let i=lo_i;i<=hi_i;i++){
    if(outline && i!==lo_i && i!==hi_i && j!==lo_j && j!==hi_j) continue;
    const old = state.map[j][i];
    const val = applyPaint(old, tool.kind, tool.n, erase);
    if(old===val) continue;
    if(currentStroke) recordChange(i,j,old);
    bumpStat(old,-1); state.map[j][i]=val; bumpStat(val,1);
  }
  scheduleDraw();
}

function copySelection(){
  if(!selection){ toast("Nenhuma seleção — use a ferramenta Seleção e arraste"); return; }
  const rows=state.map.length, cols=state.map[0]?.length||0;
  const i0=Math.max(0,Math.min(selection.i0,selection.i1)), i1=Math.min(cols-1,Math.max(selection.i0,selection.i1));
  const j0=Math.max(0,Math.min(selection.j0,selection.j1)), j1=Math.min(rows-1,Math.max(selection.j0,selection.j1));
  const cells = [];
  for(let j=j0;j<=j1;j++) cells.push(state.map[j].slice(i0,i1+1));
  clipboard = {w:i1-i0+1, h:j1-j0+1, cells};
  toast(`Copiado ${clipboard.w}×${clipboard.h}`);
}

function pasteClipboard(){
  if(!clipboard){ toast("Área de transferência vazia", true); return; }
  const rows=state.map.length, cols=state.map[0]?.length||0;
  const oi = lastMousePos.i, oj = lastMousePos.j;
  const fullyOutside = (oi+clipboard.w<=0 || oj+clipboard.h<=0 || oi>=cols || oj>=rows);
  if(fullyOutside){ toast("Cole dentro da área do mapa", true); return; }
  beginStroke();
  let inBounds = 0, changed = 0;
  for(let dj=0; dj<clipboard.h; dj++) for(let di=0; di<clipboard.w; di++){
    const i=oi+di, j=oj+dj;
    if(i<0||j<0||i>=cols||j>=rows) continue;
    inBounds++;
    const val = clipboard.cells[dj][di];
    const old = state.map[j][i];
    if(old===val) continue;
    recordChange(i,j,old);
    bumpStat(old,-1); state.map[j][i]=val; bumpStat(val,1);
    drawCell(i,j);
    changed++;
  }
  endStroke();
  if(inBounds===0){ toast("Cole dentro da área do mapa", true); return; }
  scheduleAutosave();
  const clipped = (oi<0||oj<0||oi+clipboard.w>cols||oj+clipboard.h>rows);
  toast(clipped ? "Colado no cursor (parcialmente fora do mapa)" : "Colado no cursor");
}

function transformClipboard(kind){
  if(!clipboard){ toast("Área de transferência vazia"); return; }
  const {w,h,cells} = clipboard;
  if(kind==="mirrorH"){
    clipboard.cells = cells.map(row=>row.slice().reverse());
  } else if(kind==="mirrorV"){
    clipboard.cells = cells.slice().reverse();
  } else if(kind==="rotate"){
    const rotated = [];
    for(let i=0;i<w;i++){
      const row=[];
      for(let j=h-1;j>=0;j--) row.push(cells[j][i]);
      rotated.push(row);
    }
    clipboard = {w:h, h:w, cells:rotated};
  }
  toast("Área de transferência transformada");
}

function deleteSelection(){
  if(!selection) return;
  const rows=state.map.length, cols=state.map[0]?.length||0;
  const i0=Math.max(0,Math.min(selection.i0,selection.i1)), i1=Math.min(cols-1,Math.max(selection.i0,selection.i1));
  const j0=Math.max(0,Math.min(selection.j0,selection.j1)), j1=Math.min(rows-1,Math.max(selection.j0,selection.j1));
  beginStroke();
  for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){
    const old = state.map[j][i];
    if(old==="0") continue;
    recordChange(i,j,old);
    bumpStat(old,-1); state.map[j][i]="0"; bumpStat("0",1);
    drawCell(i,j);
  }
  endStroke();
  scheduleAutosave();
  toast("Seleção apagada");
}

let dragStart = null;
let lastPaintCell = null;
let hoverEl = document.getElementById("hoverCoord");

/* Interpola célula a célula (Bresenham) entre o último ponto pintado e o
   ponto atual, evitando buracos no traço quando o mouse se move rápido
   e "pula" células entre dois eventos de mousemove. */
function paintLine(i0,j0,i1,j1,erase){
  let i=i0, j=j0;
  const dx = Math.abs(i1-i0), dy = -Math.abs(j1-j0);
  const sx = i0<i1 ? 1 : -1, sy = j0<j1 ? 1 : -1;
  let err = dx+dy;
  while(true){
    paintAt(i,j,erase);
    if(i===i1 && j===j1) break;
    const e2 = 2*err;
    if(e2>=dy){ err+=dy; i+=sx; }
    if(e2<=dx){ err+=dx; j+=sy; }
  }
}

canvas.addEventListener("mousedown", e=>{
  const {i,j} = cellFromEvent(e);
  lastMousePos = {i, j};

  if(e.button===1 || spaceDown){
    e.preventDefault();
    panning = true;
    panStart = {x:e.clientX, y:e.clientY, scrollLeft:wrap.scrollLeft, scrollTop:wrap.scrollTop};
    return;
  }
  if (e.button !== 0 && e.button !== 2) return;

  if(!inMapBounds(i,j)){ toast("Clique dentro da área do mapa", true); return; }

  if(e.altKey){ pickAt(i,j); return; }

  if(tool.kind==="select"){
    if(e.button===2) return;
    if(fillMode){ floodSelect(i,j); return; }
    selecting = {i0:i, j0:j};
    selection = null;
    return;
  }

  painting = true;
  paintErase = (e.button === 2);
  beginStroke();
  lastPaintCell = null;

  if(fillMode && !e.shiftKey){
    floodFill(i,j,paintErase);
    updatePreviewOverlay();
    return;
  }
  if(e.shiftKey){ dragStart = {i,j, outline: (e.ctrlKey||e.metaKey)}; clearPreviewRect(); }
  else {
    dragStart=null;
    if(selection){ selection = null; scheduleDraw(); }
    paintAt(i,j,paintErase);
    lastPaintCell = {i,j};
    updatePreviewOverlay();
  }
});

canvas.addEventListener("mousemove", e=>{
  const {i,j} = cellFromEvent(e);
  lastMousePos = {i, j};
  hovering = true;
  const rows=state.map.length, cols=state.map[0]?.length||0;
  const inBounds = (i>=0&&j>=0&&i<cols&&j<rows);
  hoverEl.textContent = inBounds ? `(${i}, ${j}) · ${state.map[j][i]}` : "—";

  if(panning && panStart){
    wrap.scrollLeft = panStart.scrollLeft - (e.clientX - panStart.x);
    wrap.scrollTop = panStart.scrollTop - (e.clientY - panStart.y);
    return;
  }

  if(selecting){
    selection = {i0:selecting.i0, j0:selecting.j0, i1:i, j1:j};
    scheduleDraw();
    return;
  }

  if(!painting){ updatePreviewOverlay(); scheduleDraw(); return; }
  if(dragStart){
    clearPreviewRect();
    scheduleDraw();
    requestAnimationFrame(()=>{
      ctx.setTransform(1,0,0,1,-scrollX,-scrollY);
      const {r0,r1} = brushOffsets();
      const x0=(Math.min(dragStart.i,i)-r0)*cell, y0=(Math.min(dragStart.j,j)-r0)*cell;
      const x1=(Math.max(dragStart.i,i)+r1+1)*cell, y1=(Math.max(dragStart.j,j)+r1+1)*cell;
      ctx.strokeStyle="#e0a458"; ctx.lineWidth=2;
      ctx.strokeRect(x0+1,y0+1,x1-x0-2,y1-y0-2);
      ctx.lineWidth=1;
    });
  } else {
    if(lastPaintCell && (lastPaintCell.i!==i || lastPaintCell.j!==j)){
      paintLine(lastPaintCell.i, lastPaintCell.j, i, j, paintErase);
    } else {
      paintAt(i,j,paintErase);
    }
    lastPaintCell = {i,j};
    updatePreviewOverlay();
  }
});
canvas.addEventListener("mouseleave", ()=>{ hoverEl.textContent="—"; hovering=false; clearPreviewRect(); scheduleDraw(); });

window.addEventListener("mouseup", e=>{
  if(panning){ panning=false; panStart=null; return; }
  if(selecting){
    const isSingleClick = (selecting.i0===lastMousePos.i && selecting.j0===lastMousePos.j);
    selection = isSingleClick ? null : {
      i0:Math.min(selecting.i0,lastMousePos.i), j0:Math.min(selecting.j0,lastMousePos.j),
      i1:Math.max(selecting.i0,lastMousePos.i), j1:Math.max(selecting.j0,lastMousePos.j)
    };
    selecting = null;
    scheduleDraw();
    return;
  }
  if(painting){
    if(dragStart){
      fillRect(dragStart.i, dragStart.j, lastMousePos.i, lastMousePos.j, paintErase, dragStart.outline);
    }
    painting = false;
    dragStart = null;
    lastPaintCell = null;
    endStroke();
    updatePreviewOverlay();
  }
});

canvas.addEventListener("contextmenu", e=>{
  e.preventDefault();
});

canvas.addEventListener("wheel", e=>{
  if(!(e.ctrlKey||e.metaKey)) return;
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const worldX = (e.clientX-rect.left)+scrollX, worldY = (e.clientY-rect.top)+scrollY;
  const fx = worldX/cell, fy = worldY/cell;
  const zoomInput = document.getElementById("zoomInput");
  let newCell = cell + (e.deltaY<0 ? 2 : -2);
  newCell = Math.max(4, Math.min(48, newCell));
  zoomInput.value = newCell;
  cell = newCell;
  const rows = state.map.length, cols = state.map[0]?.length||0;
  spacer.style.width=(cols*cell)+"px"; spacer.style.height=(rows*cell)+"px";
  wrap.scrollLeft = fx*cell - (e.clientX-rect.left);
  wrap.scrollTop = fy*cell - (e.clientY-rect.top);
  scheduleDraw();
}, {passive:false});

document.getElementById("brushInput").oninput = (e)=>{
  brushSize = Math.max(1, Math.min(9, parseInt(e.target.value)||1));
};
document.getElementById("btnFillMode").onclick = ()=>{
  fillMode = !fillMode;
  document.getElementById("btnFillMode").classList.toggle("primary", fillMode);
  toast("Balde de tinta " + (fillMode?"ativado":"desativado"));
};
document.getElementById("btnMirrorH").onclick = ()=>transformClipboard("mirrorH");
document.getElementById("btnMirrorV").onclick = ()=>transformClipboard("mirrorV");
document.getElementById("btnRotate").onclick = ()=>transformClipboard("rotate");

document.getElementById("zoomInput").oninput = drawMap;
document.getElementById("btnFit").onclick = ()=>{
  const rows = state.map.length, cols = state.map[0]?.length||0;
  const availW = wrap.clientWidth-4, availH = wrap.clientHeight-4;
  let z = Math.floor(Math.min(availW/cols, availH/rows));
  z = Math.max(4, Math.min(48, z||26));
  document.getElementById("zoomInput").value = z;
  drawMap();
};

document.getElementById("btnResize").onclick = ()=>{
  const newRows = Math.max(1, Math.min(4000, parseInt(document.getElementById("rowsInput").value)||state.map.length));
  const newCols = Math.max(1, Math.min(4000, parseInt(document.getElementById("colsInput").value)||state.map[0].length));
  if(newRows*newCols > 1000000 && !confirm(`Isso cria um mapa com ${newRows*newCols.toLocaleString?newRows*newCols:newRows*newCols} células. Mapas muito grandes usam mais memória e podem deixar o carregamento no jogo mais lento. Continuar?`)) return;
  const oldRows = state.map.length, oldCols = state.map[0].length;
  const g = [];
  for(let j=0;j<newRows;j++){
    const row=[];
    for(let i=0;i<newCols;i++){
      if(j<oldRows && i<oldCols){
        row.push(state.map[j][i]);
      } else {
        const onNewBorder = (i===0 || j===0 || i===newCols-1 || j===newRows-1);
        row.push(onNewBorder ? "1" : "0");
      }
    }
    g.push(row);
  }
  state.map = g;
  undoStack=[]; redoStack=[];
  computeStats();
  drawMap();
  saveAutosave();
  toast(`Mapa redimensionado para ${newCols}×${newRows}`);
};

window.addEventListener("keydown", e=>{
  const tgt = e.target;
  if(tgt && (tgt.tagName==="INPUT" || tgt.tagName==="TEXTAREA")) return;
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z"){
    e.preventDefault();
    if(e.shiftKey) redo(); else undo();
    return;
  }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="y"){
    e.preventDefault(); redo(); return;
  }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="c"){
    e.preventDefault(); copySelection(); return;
  }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="v"){
    e.preventDefault();
    if(!pastePreview){ pastePreview = true; scheduleDraw(); }
    return;
  }
  if(e.code==="Space"){
    e.preventDefault();
    if(!spaceDown){ spaceDown = true; canvas.style.cursor = "grab"; }
    return;
  }
  if(e.key.toLowerCase()==="f"){
    fillMode = !fillMode;
    document.getElementById("btnFillMode").classList.toggle("primary", fillMode);
    toast("Balde de tinta " + (fillMode?"ativado":"desativado"));
    return;
  }
  if(e.key>="0" && e.key<="9"){
    const n = parseInt(e.key);
    tool = n===0 ? {kind:"empty",n:0} : {kind:"wall", n};
    paletteHTML();
  } else if(e.key==="Delete" || e.key==="Backspace"){
    e.preventDefault();
    deleteSelection();
  }
});
window.addEventListener("keyup", e=>{
  if(e.code==="Space"){
    e.preventDefault();
    spaceDown = false; canvas.style.cursor = "none";
  }
  if(pastePreview && (e.key.toLowerCase()==="v" || e.key==="Control" || e.key==="Meta")){
    pastePreview = false;
    pasteClipboard();
    scheduleDraw();
  }
});

const TABS = [
  {id:"config", label:"Config"},
  {id:"spawn", label:"Spawn"},
  {id:"info", label:"Info"},
  {id:"colors", label:"Cores"},
  {id:"textures", label:"Texturas"},
  {id:"lights", label:"Luzes"},
  {id:"theme", label:"Tema"},
  {id:"sky", label:"Céu"},
  {id:"title", label:"Título"},
  {id:"billboards", label:"Billboards"},
  {id:"particles", label:"Partículas"},
];
let activeTab = "config";

function buildTabs(){
  const tb = document.getElementById("tabs");
  tb.innerHTML = "";
  for(const t of TABS){
    const b = document.createElement("button");
    b.textContent = t.label;
    b.className = t.id===activeTab ? "active":"";
    b.onclick = ()=>{ activeTab = t.id; renderPanels(); };
    tb.appendChild(b);
  }
}

function field(label, value, onChange, opts={}){
  const wrap = document.createElement("div"); wrap.className="field";
  const lab = document.createElement("label"); lab.textContent = label;
  const inp = document.createElement("input");
  inp.type = opts.type || "text";
  if(opts.step) inp.step = opts.step;
  if(opts.min !== undefined) inp.min = opts.min;
  if(opts.max !== undefined) inp.max = opts.max;
  inp.value = value;
  inp.oninput = ()=> onChange(opts.type==="number" ? parseFloat(inp.value) : inp.value);
  if(opts.type==="number"){
    inp.onblur = ()=>{
      let v = parseFloat(inp.value);
      if(Number.isNaN(v)) v = opts.min !== undefined ? parseFloat(opts.min) : 0;
      if(opts.min !== undefined && v < parseFloat(opts.min)) v = parseFloat(opts.min);
      if(opts.max !== undefined && v > parseFloat(opts.max)) v = parseFloat(opts.max);
      inp.value = v;
      onChange(v);
    };
  }
  wrap.appendChild(lab); wrap.appendChild(inp);
  return wrap;
}

function colorField(label, value, onChange){
  const wrap = document.createElement("div"); wrap.className="field";
  const lab = document.createElement("label"); lab.textContent = label;
  const row = document.createElement("div"); row.style.display="flex"; row.style.gap="6px";
  const inp = document.createElement("input"); inp.type="text"; inp.value=value; inp.style.flex="1";
  const cp = document.createElement("input"); cp.type="color"; cp.value=/^#[0-9a-f]{6}$/i.test(value)?value:"#888888";
  cp.style.width="36px"; cp.style.padding="0"; cp.style.border="1px solid var(--line)";
  inp.oninput = ()=>{ onChange(inp.value); cp.value=/^#[0-9a-f]{6}$/i.test(inp.value)?inp.value:cp.value; };
  cp.oninput = ()=>{ inp.value=cp.value; onChange(cp.value); };
  row.appendChild(inp); row.appendChild(cp);
  wrap.appendChild(lab); wrap.appendChild(row);
  return wrap;
}

function checkField(label, value, onChange){
  const wrap = document.createElement("div"); wrap.className="field";
  const row = document.createElement("div"); row.style.display="flex"; row.style.alignItems="center"; row.style.gap="6px";
  const inp = document.createElement("input"); inp.type="checkbox"; inp.checked=!!value;
  inp.onchange = ()=> onChange(inp.checked);
  const lab = document.createElement("label"); lab.textContent = label; lab.style.margin="0"; lab.style.cursor="pointer";
  row.appendChild(inp); row.appendChild(lab);
  wrap.appendChild(row);
  return wrap;
}

function panelConfig(root){
  const fs = document.createElement("fieldset");
  fs.innerHTML = `<legend>Janela &amp; câmera</legend>`;
  const r1 = document.createElement("div"); r1.className="row2";
  r1.appendChild(field("Largura (px)", state.config.window_w, v=>state.config.window_w=v, {type:"number"}));

/* ───────────────────────── TOP BAR ACTIONS ───────────────────────── */

function toast(msg, isError){
  const el = document.getElementById("status");
  el.textContent = msg; el.classList.add("show");
  el.classList.toggle("error", !!isError);
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove("show"), 2200);
}

document.getElementById("btnNew").onclick = ()=>{
  if(!confirm("Descartar o mapa atual e começar um novo?")) return;
  state = freshState(); tool={kind:"wall",n:1};
  undoStack=[]; redoStack=[];
  paletteHTML(); computeStats(); drawMap(); renderPanels();
  saveAutosave();
  toast("Novo mapa criado");
};

document.getElementById("btnLoad").onclick = ()=>document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange = (e)=>{
  const file = e.target.files[0]; if(!file) return;
  openFile(file);
  e.target.value = "";
};

function openFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      state = loadRcfg(reader.result);
      undoStack=[]; redoStack=[];
      paletteHTML(); computeStats(); drawMap(); renderPanels();
      saveAutosave();
      toast(`Carregado: ${file.name}`);
    }catch(err){
      alert("Erro ao carregar .rcfg: " + err.message);
    }
  };
  reader.readAsText(file);
}

window.addEventListener("dragover", e=>{
  const types = e.dataTransfer && Array.from(e.dataTransfer.types);
  if(types && types.includes("Files")) e.preventDefault();
});
window.addEventListener("drop", e=>{
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if(!f) return;
  e.preventDefault();
  if(!/\.(rcfg|txt)$/i.test(f.name)){
    toast("Solte um arquivo .rcfg");
    return;
  }
  openFile(f);
});

document.getElementById("btnExport").onclick = ()=>{
  const text = serializeRcfg(state);
  const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = (state.title.replace(/[^\w\-]+/g,"_").replace(/^_+|_+$/g,"") || "mapa") + ".rcfg";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("Arquivo .rcfg baixado");
};

/* ───────────────────────── AUTOSAVE ───────────────────────── */

function saveAutosave(){
  try{
    localStorage.setItem(AUTOSAVE_KEY, JSON.stringify({savedAt:Date.now(), rcfg:serializeRcfg(state)}));
  }catch(err){ /* quota exceeded ou indisponível — ignora silenciosamente */ }
}

let autosaveTimer = null;
function scheduleAutosave(){
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(saveAutosave, 1500);
}

function tryRestoreAutosave(){
  let raw;
  try{ raw = localStorage.getItem(AUTOSAVE_KEY); }catch(err){ return; }
  if(!raw) return;
  try{
    const data = JSON.parse(raw);
    const when = new Date(data.savedAt).toLocaleString("pt-BR");
    if(confirm(`Encontrado um mapa salvo automaticamente (${when}). Deseja recuperá-lo?`)){
      state = loadRcfg(data.rcfg);
      undoStack=[]; redoStack=[];
      toast("Mapa recuperado do autosave");
    }
  }catch(err){ /* autosave corrompido — ignora */ }
}

/* ───────────────────────── INIT ───────────────────────── */
tryRestoreAutosave();
paletteHTML();
computeStats();
drawMap();
renderPanels();
setInterval(saveAutosave, 20000);
window.addEventListener("beforeunload", saveAutosave);
</script>
